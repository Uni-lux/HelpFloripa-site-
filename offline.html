<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Sem internet · Help Floripa</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(80% 60% at 50% 0%, rgba(0, 173, 238, .18), transparent 70%), #000; color: #fff; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { display: grid; justify-items: center; gap: 14px; max-width: 360px; }
    img { width: min(300px, 80vw); height: auto; margin-bottom: 10px; mix-blend-mode: lighten; }
    h1 { margin: 6px 0 0; font-size: 24px; } p { margin: 0; color: #9fb1bd; }
    button { margin-top: 8px; min-height: 48px; padding: 0 26px; border: 0; border-radius: 999px; background: #00adee; color: #001a24; font: inherit; font-weight: 800; cursor: pointer; }
    button:active { background: #0087c2; }
  </style>
</head>
<body>
  <main>
    <img src="logo-horizontal.png" alt="Help Floripa · Tudo que você precisa em um só lugar" />
    <h1>Você está sem internet</h1>
    <p>Confira o Wi-Fi ou os dados móveis. Assim que a conexão voltar, é só tentar de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
