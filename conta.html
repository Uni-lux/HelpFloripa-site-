    // Tema claro/escuro: o mesmo escolhido no resto do site.
    (function () {
      var c = {};
      try { c = JSON.parse(localStorage.getItem("hf-chat-config") || "{}"); } catch (e) {}
      var tema = c.tema || "sistema";
      var escuro = tema === "escuro" || (tema === "sistema" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = escuro ? "dark" : "light";

  <div class="acesso">
    <aside class="acesso-marca" aria-label="Help Floripa">
      <a class="logo" href="index.html"><strong>HELP <span>FLORIPA</span></strong><small>TUDO EM UM SÓ LUGAR</small></a>

          <p class="sub" id="sub">Carregando...</p>
          <div class="aviso info" id="detalhe" hidden></div>
          <div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>
          <div class="botoes" style="margin-top:16px; flex-direction:column">
            <button type="button" class="botao" id="principal" hidden></button>
            <button type="button" class="botao sec" id="sair" hidden>Sair da conta</button>

        </div>
