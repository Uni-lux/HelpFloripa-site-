  <style>
    /* =====================================================================================================
       Social (16/11/2026, 6ª versão, pedido dele com um modelo em HTML: "usa algo assim"): cartão do perfil com os números,
       o link do duo (Akai Ito: NÃO mexer, ele aprovou), conexões em destaque (fileira), filtros com contagem + ordenação,
       cartões das conexões (Ver perfil · Mensagem) e, para o dono, como o duo aparece no perfil. Cores e letras da rede.
       NÃO voltar a gótico/radar/coração/sistema solar.
       ===================================================================================================== */
    :root {
      --accent: #00adee; --accent-ink: #001a24; --danger: #e5484d;
      --duo: #ff4d6d; --familia: #f5b301; --amizade: #00adee; --trabalho: #2fbf71;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --ceu: #01050a; --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    }
    :root[data-theme="dark"] { --bg: #000; --panel: #0b0e11; --panel-2: #14191d; --hover: #171d22; --line: rgba(255, 255, 255, .1); --text: #eef3f6; --muted: #8b9aa5; --overlay: rgba(0, 0, 0, .7); --sombra: 0 18px 50px rgba(0, 0, 0, .5); }
    :root[data-theme="light"] { --bg: #f2f4f6; --panel: #fff; --panel-2: #f4f6f8; --hover: #eef2f5; --line: #e4e9ed; --text: #0e1a21; --muted: #607380; --overlay: rgba(10, 20, 26, .5); --sombra: 0 18px 50px rgba(15, 30, 40, .12); }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { overflow-x: clip; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; }
    a { color: inherit; }
    svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    svg.i.s { width: 16px; height: 16px; }
    [data-cat="duo"] { --cor: var(--duo); }
    [data-cat="familia"] { --cor: var(--familia); }
    [data-cat="amizade"] { --cor: var(--amizade); }
    [data-cat="trabalho"] { --cor: var(--trabalho); }
    .icone-btn { position: relative; width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--text); text-decoration: none; }
    @media (hover: hover) { .icone-btn:hover { background: var(--hover); } }
    .icone-btn.vazio { pointer-events: none; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; background: linear-gradient(135deg, #0a4a63, #00adee); color: #fff; display: grid; place-items: center; font-weight: 750; flex-shrink: 0; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* topo */
    .topo { position: sticky; top: 0; z-index: 1200; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 4px;
      height: calc(54px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 6px 0; background: var(--panel); border-bottom: 1px solid var(--line); }
    :root[data-theme="dark"] .topo { background: #000; border-bottom-color: rgba(255, 255, 255, .12); }
    .topo-tit { margin: 0; min-width: 0; display: grid; justify-items: center; line-height: 1.15; }
    .topo-tit span { font-size: 16.5px; font-weight: 800; letter-spacing: -.2px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topo-tit small { font-size: 12px; font-weight: 600; color: var(--muted); }
    .topo-tit small:empty { display: none; }

    .pg { width: min(760px, 100%); margin: 0 auto; padding: 0 0 calc(40px + env(safe-area-inset-bottom)); }
    #conteudo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
    .estado { padding: 80px 20px; text-align: center; color: var(--muted); }
    .estado strong { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }

    /* ---------- cartão do perfil, destaques, filtros e conexões (modelo dele, 16/11) ---------- */
    :root { --head: "Manrope", var(--font); }
    h1, h2, h3, .hs-stats b, .ceu-total { font-family: var(--head); }
    .hero-social { position: relative; overflow: hidden; margin: 10px 10px 0; padding: 18px; border-radius: 22px; isolation: isolate;
      border: 1px solid color-mix(in srgb, var(--accent) 36%, var(--line));
      background: linear-gradient(115deg, color-mix(in srgb, var(--accent) 15%, var(--panel)) 0%, var(--panel) 56%, color-mix(in srgb, #a65a9a 9%, var(--panel)) 100%); }
    .hero-social::before { content: ""; position: absolute; z-index: -1; width: 320px; height: 320px; right: -110px; top: -190px; border-radius: 50%; pointer-events: none;
      border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent); box-shadow: 0 0 0 24px color-mix(in srgb, var(--accent) 5%, transparent), 0 0 0 54px color-mix(in srgb, var(--accent) 3%, transparent); }
    @media (min-width: 700px) { .hero-social { margin: 14px 14px 0; padding: 22px; } }
    .hs-topo { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .hs-av { width: 72px; height: 72px; border-radius: 22px; font-size: 24px; border: 2px solid color-mix(in srgb, var(--accent) 75%, #fff); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 12%, transparent); }
    .hs-info { min-width: 0; flex: 1; }
    .hs-info h2 { margin: 0; display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 800; letter-spacing: -.5px; line-height: 1.2; }
    .hs-info h2 span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .selo-v { width: 17px; height: 17px; flex: none; color: #1d9bf0; fill: currentColor; stroke: none; }
    .hs-nick { margin-top: 3px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hs-bio { margin: 8px 0 0; font-size: 13px; line-height: 1.45; color: color-mix(in srgb, var(--text) 78%, var(--muted)); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .hs-bio:empty { display: none; }
    .hs-acoes { display: flex; gap: 8px; margin-top: 14px; }
    .hs-acoes button, .hs-acoes a { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 11px; text-decoration: none;
      border: 1px solid var(--line); background: color-mix(in srgb, var(--text) 5%, transparent); color: var(--text); font-size: 12.5px; font-weight: 700; cursor: pointer; }
    @media (hover: hover) { .hs-acoes button:hover, .hs-acoes a:hover { background: var(--hover); } }
    .hs-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
    .hs-stat { display: grid; gap: 2px; justify-items: center; padding: 0 4px; }
    .hs-stat + .hs-stat { border-left: 1px solid var(--line); }
    .hs-stat b { font-size: 19px; font-weight: 800; line-height: 1.2; }
    .hs-stat span { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .sec-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 16px 10px; }
    .sec-cab h3 { margin: 0; font-size: 16.5px; font-weight: 800; letter-spacing: -.3px; }
    .sec-cab p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
    .sec-cab button { border: 0; background: none; color: var(--accent); font-size: 12.5px; font-weight: 700; cursor: pointer; padding: 6px 0; white-space: nowrap; }
    .destaques { display: flex; gap: 12px; overflow-x: auto; padding: 2px 16px 6px; scrollbar-width: none; scroll-padding: 16px; }
    .destaques::-webkit-scrollbar { display: none; }
    .dest { flex: none; width: 72px; display: grid; justify-items: center; gap: 2px; padding: 0; border: 0; background: none; color: var(--text); text-align: center; cursor: pointer; }
    .dest[disabled] { cursor: default; }
    .dest .anel { width: 62px; height: 62px; margin-bottom: 5px; padding: 3px; border-radius: 20px; background: linear-gradient(140deg, var(--cor), color-mix(in srgb, var(--cor) 40%, #6b4fb0)); }
    .dest .anel .avatar { width: 100%; height: 100%; border-radius: 17px; font-size: 16px; box-shadow: 0 0 0 3px var(--bg); }
    .dest strong { max-width: 72px; font-size: 11.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dest small { max-width: 72px; font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dest.pend { opacity: .55; }
    .dest.novo .anel { background: none; border: 1.5px dashed color-mix(in srgb, var(--accent) 70%, transparent); display: grid; place-items: center; color: var(--accent); padding: 0; }
    .dest.novo .anel svg { width: 24px; height: 24px; }
    @media (hover: hover) { .dest:not([disabled]):hover .anel { transform: translateY(-2px); } }
    .dest .anel { transition: transform .15s; }
    .controles { display: flex; align-items: center; gap: 8px; padding: 0 16px; }
    .chips { flex: 1; min-width: 0; display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chips button { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted);
      font-size: 12px; font-weight: 750; white-space: nowrap; cursor: pointer; }
    .chips button i { width: 7px; height: 7px; border-radius: 50%; background: var(--cor); }
    .chips button b { font-size: 11.5px; font-weight: 800; color: var(--text); opacity: .7; }
    .chips button.on { color: var(--text); border-color: color-mix(in srgb, var(--cor, var(--accent)) 60%, transparent); background: color-mix(in srgb, var(--cor, var(--accent)) 13%, var(--panel)); }
    .ordem { flex: none; max-width: 120px; height: 34px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 12px; font-weight: 650; }
    .rede { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 12px 12px 0; }
    @media (max-width: 380px) { .rede { grid-template-columns: minmax(0, 1fr); } }
    .pessoa { position: relative; min-width: 0; display: flex; flex-direction: column; padding: 13px 12px 12px; border-radius: 17px; border: 1px solid var(--line); background: var(--panel); transition: transform .15s, border-color .15s; }
    .pessoa::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 2px; border-radius: 0 0 2px 2px; background: var(--cor); opacity: .85; }
    @media (hover: hover) { .pessoa:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--cor) 45%, var(--line)); } }
    .pessoa.pend { opacity: .85; border-style: dashed; }
    .pessoa.pend::before { background: repeating-linear-gradient(90deg, var(--cor) 0 5px, transparent 5px 9px); }
    .pe-topo { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .pe-av { position: relative; flex: none; }
    .pe-av .avatar { width: 40px; height: 40px; font-size: 14px; box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--cor); }
    .pe-av .on { position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; background: #40d6a0; box-shadow: 0 0 0 2.5px var(--panel); }
    .pe-nome { min-width: 0; flex: 1; }
    .pe-nome b { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 800; line-height: 1.25; }
    .pe-nome b span { min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .pe-nome small { display: block; margin-top: 2px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pe-texto { margin: 10px 0 0; min-height: 31px; font-size: 11.5px; line-height: 1.4; color: color-mix(in srgb, var(--text) 70%, var(--muted)); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .pe-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
    .pe-tag { padding: 3px 8px; border-radius: 7px; font-size: 10px; font-weight: 700; color: color-mix(in srgb, var(--cor) 78%, var(--text)); background: color-mix(in srgb, var(--cor) 13%, transparent); }
    .pe-tag.neutra { color: var(--muted); background: var(--panel-2); }
    .pe-pes { display: flex; gap: 6px; margin-top: auto; padding-top: 12px; }
    .pe-pes button { flex: 1; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 34px; padding: 0 6px; border-radius: 10px; font-size: 11.5px; font-weight: 750; cursor: pointer;
      border: 1px solid var(--line); background: var(--panel-2); color: var(--text); white-space: nowrap; }
    .pe-pes button svg { width: 15px; height: 15px; }
    .pe-pes button.msg { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
    .pessoa > button.mais { display: grid; place-items: center; cursor: pointer; position: absolute; right: 8px; top: 9px; flex: none; width: 28px; height: 28px; padding: 0; border: 0; background: none; color: var(--muted); }
    .pessoa.com-mais .pe-nome { padding-right: 18px; }
    .pe-pes button[disabled] { opacity: .45; cursor: default; }
    .vazio-rede { grid-column: 1 / -1; padding: 30px 16px; text-align: center; color: var(--muted); font-size: 13.5px; border: 1px dashed var(--line); border-radius: 17px; }
    .vazio-rede a { color: var(--accent); font-weight: 700; }
    .ceu-total { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .nota { margin: 0 16px; text-align: center; color: var(--muted); font-size: 13px; }

    /* ---------- Akai Ito (duo), 7ª versão (16/11/2026, pedido dele): cartão organizado, sem "conectados pelo fio vermelho",
       frase de vocês (ou uma da lenda), data em que se conheceram, tempo juntos e o retrato dos dois. ---------- */
    .akai { position: relative; margin: 0 14px; padding: 16px 16px 14px; border-radius: 22px; overflow: hidden; color: #fff; isolation: isolate;
      background: radial-gradient(120% 80% at 50% 0%, rgba(255, 77, 109, .24), transparent 62%), linear-gradient(172deg, #1c0811 0%, #0d0509 58%, #08060a 100%);
      border: 1px solid rgba(255, 77, 109, .34); box-shadow: 0 16px 40px rgba(70, 0, 18, .22); }
    .akai::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(55% 45% at 100% 100%, rgba(255, 77, 109, .1), transparent 72%), radial-gradient(40% 35% at 0% 100%, rgba(255, 140, 160, .06), transparent 72%); }
    .ak-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 30px; }
    .ak-rot { display: flex; align-items: center; gap: 7px; min-width: 0; font: 800 11px/1 var(--head); letter-spacing: 1.6px; text-transform: uppercase; color: #ff9fb0; }
    .ak-rot svg { width: 15px; height: 15px; color: #ff4d6d; }
    .ak-rot small { font: 700 10.5px/1 var(--font); letter-spacing: .2px; text-transform: none; color: rgba(255, 222, 230, .72); padding: 5px 9px; border-radius: 99px; background: rgba(255, 255, 255, .07); white-space: nowrap; }
    .ak-edit { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 99px; border: 1px solid rgba(255, 255, 255, .16); background: rgba(255, 255, 255, .07); color: #fff; font-size: 12px; font-weight: 750; cursor: pointer; }
    .ak-edit svg { width: 14px; height: 14px; }
    @media (hover: hover) { .ak-edit:hover { background: rgba(255, 255, 255, .13); } }
    .ak-retrato { position: relative; display: block; width: 100%; margin: 14px 0 0; padding: 0; border: 1px solid rgba(255, 255, 255, .08); border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; max-height: 300px; background: #160a0f; cursor: zoom-in; }
    .ak-retrato img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ak-retrato::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 60%, rgba(8, 4, 7, .55)); pointer-events: none; }
    .akai-par { position: relative; display: flex; align-items: center; justify-content: space-between; margin: 16px 6px 12px; }
    .akai-fio { position: absolute; left: 44px; right: 44px; top: 4px; height: 50px; overflow: visible; pointer-events: none; }
    .akai-fio path.linha { fill: none; stroke: #ff4d6d; stroke-width: 1.6; stroke-linecap: round; filter: drop-shadow(0 0 5px rgba(255, 77, 109, .95)); }
    .akai-fio path.linha.b { stroke: rgba(255, 140, 160, .45); stroke-width: 1; }
    .akai-fio path.brilho { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 14 400; animation: correr 2.6s linear infinite; }
    @keyframes correr { from { stroke-dashoffset: 420; } to { stroke-dashoffset: 0; } }
    .akai-cor { position: absolute; left: 50%; top: 14px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; transform: translateX(-50%); z-index: 2;
      background: #fff; color: #e0243b; box-shadow: 0 0 0 4px rgba(255, 77, 109, .2), 0 0 22px rgba(255, 77, 109, .9); }
    .akai-cor svg { width: 18px; height: 18px; }
    .akai-pessoa { position: relative; z-index: 2; display: grid; justify-items: center; gap: 6px; width: 96px; padding: 0; border: 0; background: none; color: #fff; cursor: pointer; }
    .akai-pessoa[disabled] { cursor: default; }
    .ak-av { position: relative; }
    .akai-pessoa .avatar { width: 58px; height: 58px; font-size: 18px; box-shadow: 0 0 0 2.5px #14060c, 0 0 0 4px #ff4d6d, 0 0 26px rgba(255, 77, 109, .45); }
    .akai-pessoa strong { max-width: 96px; font: 800 14px/1.2 var(--head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .akai-pessoa em { margin-top: -3px; font-size: 10.5px; font-weight: 700; font-style: normal; color: #ff9fb0; }
    .ak-frase { margin: 0 4px; text-align: center; font: 600 15px/1.5 var(--head); letter-spacing: -.1px; color: #ffe9ee; text-wrap: balance; overflow-wrap: anywhere; }
    .ak-frase::before, .ak-frase::after { color: #ff4d6d; font-weight: 800; }
    .ak-frase::before { content: "“"; margin-right: 1px; }

  <script type="module">
    import { fotoSegura } from "./seguranca.js?v=1";
    import { confirmarHF } from "./confirmar.js?v=6";
    import { ESTILOS_DUO, lerModoDuo, montarModoDuo, valorDuo, textoModoDuo, salvarModoDuo, duoDaConta } from "./duo-modo.js?v=1";
    import { iconeEl, iconeEspecie } from "./icones-hf.js?v=1";
    import { QUEM_PODE } from "./presentes-base.js?v=2";
    const $ = (id) => document.getElementById(id);
    // Duo inclui namorado(a) e cônjuge: é a pessoa ligada pelo Akai Ito.
    const TIPOS = {
      duo: ["Duo", "duo"], namoro: ["Namorado(a)", "duo"], casamento: ["Cônjuge", "duo"],
      melhor_amigo: ["Melhor amigo(a)", "amizade"], amigo: ["Amigo(a)", "amizade"],
      irmao: ["Irmão(ã)", "familia"], pai_mae: ["Pai/Mãe", "familia"], filho: ["Filho(a)", "familia"],
      primo: ["Primo(a)", "familia"], tio: ["Tio(a)", "familia"], sobrinho: ["Sobrinho(a)", "familia"],
      avo: ["Avô/Avó", "familia"], neto: ["Neto(a)", "familia"], parceiro: ["Colega de trabalho", "trabalho"]
    };
    // Igual ao inversos() das regras do vínculo.
    const INVERSO = { duo: "duo", namoro: "namoro", casamento: "casamento", melhor_amigo: "melhor_amigo", amigo: "amigo", irmao: "irmao", pai_mae: "filho", filho: "pai_mae", primo: "primo", tio: "sobrinho", sobrinho: "tio", avo: "neto", neto: "avo", parceiro: "parceiro" };
    const TIPOS_DUO = ["duo", "namoro", "casamento"];
    const GRUPOS = [
      { cat: "duo", nome: "Amor" }, { cat: "amizade", nome: "Amizades" },
      { cat: "trabalho", nome: "Colegas" }, { cat: "familia", nome: "Família" }
    ];
    const nomeGrupo = (cat) => GRUPOS.find((g) => g.cat === cat)?.nome || "";
    // Frase do cartão do duo quando os dois ainda não escreveram a deles (sempre a mesma para cada duo).
    const FRASES = [
      "Um fio vermelho invisível liga quem estava destinado a se encontrar.",
      "O fio pode esticar e se enrolar, mas nunca se rompe.",
      "Algumas pessoas a gente encontra. Outras, a gente reconhece.",
      "Tem encontro que muda o caminho inteiro."
    ];
    const SUGESTOES = ["Melhor encontro da vida.", "Parceiros em tudo.", "Desde o primeiro café.", "Do jeito que tinha que ser."];
    const hashTexto = (s) => [...String(s)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
    const fraseDe = (c) => c.frase || FRASES[hashTexto(c.id) % FRASES.length];

    const urlSegura = (u) => fotoSegura(u);
    const iniciais = (n) => { const p = String(n || "?").trim().split(/\s+/); return ((p[0]?.[0] || "?") + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase(); };
    const primeiroNome = (n) => String(n || "Usuário").split(" ")[0];
    function pintarAvatar(el, foto, nome) {
      el.replaceChildren();
      const u = urlSegura(foto);
      if (u) { const i = document.createElement("img"); i.src = u; i.alt = ""; i.onerror = () => { el.textContent = iniciais(nome); }; el.appendChild(i); }
      else el.textContent = iniciais(nome);
    }
    function novoAvatar(foto, nome) { const d = document.createElement("div"); d.className = "avatar"; pintarAvatar(d, foto, nome); return d; }
    function icone(nome, classe = "i s") {
      const ns = "http://www.w3.org/2000/svg";
      const s = document.createElementNS(ns, "svg"); s.setAttribute("class", classe);
      const u = document.createElementNS(ns, "use"); u.setAttribute("href", "#i-" + nome); s.appendChild(u);
      return s;
    }
    const svgEl = (tag, attrs) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v)); return e; };
    const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
    const botao = (cls, txt, fn) => { const b = el("button", cls, txt); b.type = "button"; if (fn) b.addEventListener("click", fn); return b; };
    function toast(t) { document.querySelectorAll(".toast").forEach((x) => x.remove()); const d = el("div", "toast", String(t ?? "").replace(/(R\$|\d)\s+(?=\S)/g, "$1 ")); document.body.appendChild(d); setTimeout(() => d.remove(), 3500); }
    function estado(titulo, texto) { $("conteudo").hidden = true; $("estado").hidden = false; $("estado").replaceChildren(el("strong", null, titulo), texto || ""); }
    const irPerfil = (uid) => { location.href = `usuarios.html?perfil=${encodeURIComponent(uid)}`; };
    const irPresente = (uid) => { location.href = `presentes.html?para=${encodeURIComponent(uid)}`; };

    // ---------- datas ----------
    const hojeISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
    const deISO = (s) => (/^\d{4}-\d{2}-\d{2}$/.test(s || "") ? new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) : null);
    const dataLonga = (d) => d.toLocaleDateString("pt-BR", { day: "numeric", month: "long", year: "numeric" });
    const dataCurta = (d) => d.toLocaleDateString("pt-BR", { day: "numeric", month: "short", year: "numeric" }).replace(/\./g, "");
    const mesAno = (d) => d.toLocaleDateString("pt-BR", { month: "short", year: "numeric" }).replace(/\./g, "").replace(" de ", " ");
    function tempoDesde(d) {
      const a = new Date();
      let meses = (a.getFullYear() - d.getFullYear()) * 12 + (a.getMonth() - d.getMonth());
      if (a.getDate() < d.getDate()) meses--;
      if (meses < 1) { const dias = Math.max(0, Math.floor((a - d) / 864e5)); return dias === 1 ? "1 dia" : `${dias} dias`; }
      const anos = Math.floor(meses / 12), m = meses % 12;
      const tA = anos ? (anos === 1 ? "1 ano" : `${anos} anos`) : "", tM = m ? (m === 1 ? "1 mês" : `${m} meses`) : "";
      return [tA, tM].filter(Boolean).join(" e ");
    }

    let fb, eu, dono, donoId, proprio = false, clicavel = false;
    let conexoes = [];
    let filtro = "todos", ordem = "recentes";
    let conta = null; // usuarios/{eu} (só no seu social)
    let pets = new Map(); // uid → pets visíveis
    const retratos = new Map(); // id do vínculo → Promise<url>

    async function podeAbrirPerfis() {
      if (proprio) return true;
      const vis = dono.socialVisibilidade || "todos";
      if (vis === "todos") return true;
      if (vis === "ocultar") return false;
      const [euSigo, meSegue] = await Promise.all([
        fb.getDoc(fb.doc(fb.db, "relacoes", `${eu.uid}_${donoId}`)).then((s) => s.exists()).catch(() => false),
        fb.getDoc(fb.doc(fb.db, "relacoes", `${donoId}_${eu.uid}`)).then((s) => s.exists()).catch(() => false)
      ]);
      return vis === "seguidores" ? euSigo : euSigo && meSegue;
    }

    // ---------- gaveta (o "voltar" do celular fecha: .folha.aberta + [data-fechar], voltar.js) ----------
    function abrirFolha(titulo, montar, { grande = false, pe = null } = {}) {
      const fundo = el("div", "folha-fundo");
      if (document.querySelector(".folha-fundo")) fundo.classList.add("empilhada");
      const f = el("div", "folha aberta" + (grande ? " grande" : ""));
      f.setAttribute("role", "dialog");
      f.setAttribute("aria-modal", "true");
      f.setAttribute("aria-label", titulo);
      const topo = el("div", "folha-topo");
      const fechar = el("button", "icone-btn");
      fechar.type = "button"; fechar.setAttribute("aria-label", "Fechar"); fechar.dataset.fechar = "";
      fechar.appendChild(icone("fechar", "i"));
      topo.append(el("h3", null, titulo), fechar);
      const corpo = el("div", "folha-corpo");
      f.append(topo, corpo);
      fundo.appendChild(f);
      const sair = () => fundo.remove();
      fechar.addEventListener("click", sair);
      fundo.addEventListener("click", (e) => { if (e.target === fundo) sair(); });
      f.addEventListener("keydown", (e) => { if (e.key === "Escape") { e.preventDefault(); sair(); } });
      const rodape = pe ? el("div", "folha-pe") : null;
      if (rodape) f.appendChild(rodape);
      montar(corpo, sair, rodape);
      document.body.appendChild(fundo);
      fechar.focus({ preventScroll: true });
      return { fundo, corpo, sair };
    }
    function verFoto(url) {
      const d = el("div", "foto-grande"); d.setAttribute("role", "dialog"); d.setAttribute("aria-label", "Retrato"); d.tabIndex = -1;
      const i = el("img"); i.src = url; i.alt = "Retrato";
      d.appendChild(i);
      const sair = () => d.remove();
      d.addEventListener("click", sair);
      d.addEventListener("keydown", (e) => { if (e.key === "Escape") sair(); });
      document.body.appendChild(d); d.focus();
    }

    // ---------- pets (RG do pet): bolinha pequena ao lado do dono ----------
    async function carregarPets() {
      const uids = [...new Set([donoId, ...conexoes.filter((c) => !c.pendente).map((c) => c.outro)].filter(Boolean))];
      const mapa = new Map();
      const por = (d) => { const p = { id: d.id, ...d.data() }; if (!p.donoId) return; const l = mapa.get(p.donoId) || []; if (!l.some((x) => x.id === p.id)) l.push(p); mapa.set(p.donoId, l); };
      const col = fb.collection(fb.db, "pets");
      const lotes = [];
      for (let i = 0; i < uids.length; i += 30) lotes.push(uids.slice(i, i + 30));
      await Promise.all([
        ...lotes.map((l) => fb.getDocs(fb.query(col, fb.where("donoId", "in", l), fb.where("visivel", "==", true), fb.limit(80))).then((s) => s.docs.forEach(por)).catch(() => {})),
        // os seus aparecem todos para você (também os que não estão nas buscas)
        proprio ? fb.getDocs(fb.query(col, fb.where("donoId", "==", eu.uid), fb.limit(20))).then((s) => s.docs.forEach(por)).catch(() => {}) : null
      ]);
      pets = mapa;
    }
    function petBolha(uid) {
      const l = pets.get(uid);
      if (!l?.length) return null;
      const p = l.find((x) => x.status === "perdido") || l[0];
      // span (não botão): fica dentro de outros botões (foto do duo, destaques)
      const b = el("span", "pet-bol" + (p.status === "perdido" ? " perdido" : "")); b.setAttribute("role", "button"); b.tabIndex = 0;
      const nomes = l.map((x) => x.nome).join(", ");
      b.setAttribute("aria-label", (p.status === "perdido" ? `${p.nome} está perdido. ` : "") + (l.length > 1 ? `Pets: ${nomes}` : `Pet: ${p.nome}`));
      b.title = b.getAttribute("aria-label");
      const u = urlSegura(p.foto);
      if (u) { const i = el("img"); i.src = u; i.alt = ""; b.appendChild(i); }
      else { const [ic, cor] = iconeEspecie(p.especie); b.appendChild(iconeEl(ic, { cor, tam: 14 })); }
      if (l.length > 1) b.appendChild(el("b", null, String(l.length)));
      b.addEventListener("click", (e) => { e.stopPropagation(); e.preventDefault(); abrirPets(uid); });
      b.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); abrirPets(uid); } });
      return b;
    }
    function abrirPets(uid) {
      const l = pets.get(uid) || [];
      const meu = uid === eu.uid;
      const dele = uid === donoId ? dono : conexoes.find((c) => c.outro === uid)?.perfil || {};
      abrirFolha(meu ? "Seus pets" : `Pets de ${primeiroNome(dele.nome)}`, (corpo) => {
        l.forEach((p) => {
          const b = botao("linha", null, () => { location.href = `alertas.html?pet=${encodeURIComponent(p.id)}`; });
          const av = el("div", "avatar");
          const u = urlSegura(p.foto);
          if (u) { const i = el("img"); i.src = u; i.alt = ""; av.appendChild(i); } else { const [ic, cor] = iconeEspecie(p.especie); av.style.background = "var(--panel-2)"; av.appendChild(iconeEl(ic, { cor, tam: 20 })); }
          const tx = el("span", "tx");
          tx.append(el("strong", null, p.nome || "Pet"), el("small", null, p.status === "perdido" ? "Perdido · toque para ver o RG e ajudar" : [p.raca, p.porte].filter(Boolean).join(" · ") || "RG do pet"));
          b.append(av, tx, icone("avancar"));
          corpo.appendChild(b);
        });
        if (meu) { const a = el("a", "btn sec", "Gerenciar seus pets"); a.href = "alertas.html?aba=pets"; a.style.margin = "10px 18px 4px"; corpo.appendChild(a); }
      });
    }

    // ---------- retrato dos dois (vinculos_retrato/{id}) ----------
    function lerRetrato(c) {
      if (!c.retrato) return Promise.resolve("");
      if (!retratos.has(c.id)) retratos.set(c.id, fb.getDoc(fb.doc(fb.db, "vinculos_retrato", c.id)).then((s) => (s.exists() ? urlSegura(s.data().foto) || "" : "")).catch(() => ""));
      return retratos.get(c.id);
    }
    const olhar = "IntersectionObserver" in window ? new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { olhar.unobserve(e.target); e.target._carregar?.(); } }), { rootMargin: "300px" }) : null;
    function quandoAparecer(alvo, fn) { if (olhar) { alvo._carregar = fn; olhar.observe(alvo); } else fn(); }

    // ---------- ações de cada conexão ----------
    function acaoPessoa(c) {
      if (proprio) {
        return () => abrirFolha(c.perfil.nome || "Usuário", (corpo, sair) => {
          const linha = (ic, txt, sub, fn, cls = "linha") => { const b = botao(cls, null, fn); const tx = el("span", "tx"); tx.append(el("strong", null, txt)); if (sub) tx.appendChild(el("small", null, sub)); b.append(icone(ic, "i"), tx); corpo.appendChild(b); return b; };
          if (!c.pendente) {
            linha("perfil", "Ver perfil", "", () => irPerfil(c.outro));
            linha("lapis", "Memória de vocês", "Data em que se conheceram, frase e retrato", () => { sair(); abrirMemoria(c); });
            linha("presente", "Enviar um presente", "Mimo, Pix, produto ou vale", () => irPresente(c.outro));
          }
          linha("lixo", c.pendente ? (c.de === eu.uid ? "Cancelar pedido" : "Recusar pedido") : "Desfazer vínculo", "", async () => {
            if (!c.pendente && !(await confirmarHF({ titulo: "Desfazer o vínculo?", texto: `Você e ${c.perfil.nome || "esta pessoa"} deixam de aparecer como vínculo no Social.`, ok: "Desfazer", icone: "lixo" }))) return;
            try {
              if (c.retrato) await fb.deleteDoc(fb.doc(fb.db, "vinculos_retrato", c.id)).catch(() => {});
              await fb.deleteDoc(fb.doc(fb.db, "vinculos", c.id)); conexoes = conexoes.filter((x) => x.id !== c.id); sair(); desenharTudo(); toast("Pronto");
            } catch { toast("Não foi possível desfazer."); }
          }, "linha perigo");
        });
      }
      return clicavel ? () => irPerfil(c.outro) : null;
    }
    const temDuo = (ignorar) => conexoes.some((c) => !c.pendente && c.id !== ignorar && TIPOS_DUO.includes(c.tipo));
    async function responderPedido(c, aceitar, b) {
      if (aceitar && TIPOS_DUO.includes(c.tipo) && temDuo(c.id)) { toast("Você já tem um duo no seu social. Desfaça o atual para aceitar."); return; }
      if (b) b.disabled = true;
      try {
        if (aceitar) { await fb.updateDoc(fb.doc(fb.db, "vinculos", c.id), { status: "aceito", aceitoEm: fb.serverTimestamp() }); c.pendente = false; c.aceitoEm = fb.Timestamp.now(); toast(`${primeiroNome(c.perfil.nome)} entrou no seu social`); }
        else { await fb.deleteDoc(fb.doc(fb.db, "vinculos", c.id)); conexoes = conexoes.filter((x) => x.id !== c.id); toast("Pedido recusado"); }
        desenharTudo();
      } catch { toast("Não foi possível responder."); if (b) b.disabled = false; }
    }

    function listaDeNomes() {
      const lista = aceitas();
      abrirFolha(`${lista.length} ${lista.length === 1 ? "conexão" : "conexões"}`, (corpo) => {
        if (!lista.length) { corpo.appendChild(el("p", "nota", "Nenhuma conexão ainda.")); return; }
        GRUPOS.forEach((g) => {
          const doGrupo = lista.filter((c) => c.cat === g.cat);
          if (!doGrupo.length) return;
          const t = el("div", "grupo-t", `${g.nome} · ${doGrupo.length}`);
          t.dataset.cat = g.cat;
          corpo.appendChild(t);
          doGrupo.forEach((c) => {
            const b = el("button", "linha"); b.type = "button"; b.dataset.cat = c.cat;
            const tx = el("span", "tx");
            tx.append(el("strong", null, c.perfil.nome || "Usuário"), el("small", null, TIPOS[c.tipo]?.[0] || ""));
            b.append(novoAvatar(c.perfil.fotoPerfil, c.perfil.nome), tx);
            if (proprio || clicavel) { b.addEventListener("click", () => irPerfil(c.outro)); b.appendChild(icone("avancar")); } else b.disabled = true;
            corpo.appendChild(b);
          });
        });
      });
    }

    function escolherFiltro(cat) {
      filtro = filtro === cat || cat === "todos" ? "todos" : cat;
      desenharControles(); desenharDuo(); desenharRede();
    }
    const aceitas = () => conexoes.filter((c) => !c.pendente);
    const cidadeDe = (p) => [p.cidade, p.uf].filter(Boolean).join("/");

    // ---------- Memória de vocês: data, frase e retrato (um dos dois edita; aparece nos dois socials) ----------
    function reduzirRetrato(arquivo) {
      return new Promise((ok, erro) => {
        const url = URL.createObjectURL(arquivo);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          let lado = 1100, q = 0.82, saida = "";
          for (let i = 0; i < 8; i++) {
            const k = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
            const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            saida = c.toDataURL("image/jpeg", q);
            if (saida.length <= 230000) break;
            if (q > 0.6) q -= 0.08; else lado = Math.round(lado * 0.8);
          }
          saida.length <= 230000 ? ok(saida) : erro(new Error("grande"));
        };
        img.onerror = () => { URL.revokeObjectURL(url); erro(new Error("imagem")); };
        img.src = url;
      });
    }
    function abrirMemoria(c) {

        const bTirar = botao("btn sec", "Tirar", () => { foto = null; tirou = true; pintarRet(""); });
        acoes.append(bTrocar, bTirar);
        const pintarRet = (u) => {
          ret.replaceChildren();
          if (u) { const i = el("img"); i.src = u; i.alt = "Retrato de vocês"; ret.appendChild(i); } else ret.appendChild(vazio);

        ret.addEventListener("click", () => arquivo.click());
        arquivo.addEventListener("change", async () => {

          if (!f) return;

        });
        pintarRet("");
        lerRetrato(c).then((u) => { if (u && !foto && !tirou) pintarRet(u); });

        const data = el("input"); data.type = "date"; data.id = "memData"; data.max = hojeISO(); data.min = "1920-01-01"; data.value = c.conheceram || "";

        rotFrase.append(frase, conta);
        mem.append(rotRet, acoes, arquivo, rotData, rotFrase, sug, el("p", "nota-mem", `Aparece no seu social e no de ${primeiroNome(c.perfil.nome)}, para quem pode ver o Social. Os dois podem mudar.`));
        corpo.appendChild(mem);
        const salvar = botao("btn pri largo", "Salvar", async () => {
          const d = data.value;
          if (d && (!deISO(d) || d > hojeISO())) { toast("Escolha uma data até hoje."); return; }
          salvar.disabled = true;
          const novo = { conheceram: d || "", frase: frase.value.trim().slice(0, 90), retrato: foto ? true : tirou ? false : !!c.retrato };
          try {
            const lote = fb.writeBatch(fb.db);
            lote.update(fb.doc(fb.db, "vinculos", c.id), { ...novo, memoriaEm: fb.serverTimestamp(), memoriaPor: eu.uid });
            if (foto) lote.set(fb.doc(fb.db, "vinculos_retrato", c.id), { foto, por: eu.uid, em: fb.serverTimestamp() });
            else if (tirou && c.retrato) lote.delete(fb.doc(fb.db, "vinculos_retrato", c.id));
            await lote.commit();
            Object.assign(c, novo);

            // Regras de antes (sem a memória): guarda só na sua conta e só você vê.

            } catch { salvar.disabled = false; toast("Não foi possível salvar."); }

            corpo.append(busca, res);
            let tempo = 0;
            const buscar = async () => {
              const termo = inp.value.trim();
              let achados = [];
              try { const { buscarPessoas } = await import("./pessoas.js?v=6"); achados = await buscarPessoas(fb, termo, { limite: 15 }); } catch {}
              if (inp.value.trim() !== termo) return;
              res.replaceChildren();
              const lista = achados.filter((p) => p.uid && p.uid !== eu.uid).slice(0, 10);
              if (!lista.length) { res.appendChild(el("p", "aviso-add", termo ? "Ninguém encontrado com esse nome." : "Digite o nome ou o @ da pessoa.")); return; }
              lista.forEach((p) => {
                const ja = conexoes.find((c) => c.outro === p.uid);
                const b = botao("linha", null, () => { if (ja) { toast(ja.pendente ? "Já existe um pedido entre vocês." : "Essa pessoa já está no seu social."); return; } alvo = p; tipo = ""; pintar(); });
                const tx = el("span", "tx");
                tx.append(el("strong", null, p.nome || "Usuário"), el("small", null, ja ? (ja.pendente ? "Pedido em andamento" : "Já está no seu social") : [p.nickname ? "@" + p.nickname : "", cidadeDe(p)].filter(Boolean).join(" · ")));
                b.append(novoAvatar(p.fotoPerfil, p.nome), tx);
                res.appendChild(b);
              });
            };
            inp.addEventListener("input", () => { clearTimeout(tempo); tempo = setTimeout(buscar, 300); });
            buscar();
            setTimeout(() => inp.focus({ preventScroll: true }), 60);
            enviar.disabled = true;
            return;
          }
          const esc = el("div", "add-esc");
          const tx = el("span", "tx"); tx.append(el("b", null, alvo.nome || "Usuário"), el("small", null, alvo.nickname ? "@" + alvo.nickname : ""));
          esc.append(novoAvatar(alvo.fotoPerfil, alvo.nome), tx, botao("btn sec", "Trocar", () => { alvo = null; pintar(); }));
          const tipos = el("div", "tipos"); tipos.id = "addTipos";
          const ocupado = temDuo();
          GRUPOS.forEach((g) => {
            const gr = el("div", "grupo"); gr.style.setProperty("--cor", corDe(g.cat));
            gr.appendChild(el("span", null, g.nome));
            const ch = el("div", "chips-t");
            Object.entries(TIPOS).filter(([, t]) => t[1] === g.cat).forEach(([k, t]) => {
              const b = botao(k === tipo ? "on" : "", k === "duo" ? "Duo (Akai Ito)" : t[0], () => { tipo = k; pintar(); });
              b.dataset.tipo = k;
              if (ocupado && TIPOS_DUO.includes(k)) { b.disabled = true; b.title = "Você já tem um duo no seu social"; }
              ch.appendChild(b);
            });
            gr.appendChild(ch); tipos.appendChild(gr);
          });
          corpo.append(esc, el("p", "aviso-add", `O que ${primeiroNome(alvo.nome)} é para você? Ela recebe o pedido e escolhe aceitar.${ocupado ? " Você já tem um duo: desfaça o atual para escolher outro." : ""}`), tipos);
          enviar.disabled = !tipo;
          enviar.textContent = tipo ? `Enviar pedido · ${TIPOS[tipo][0]}` : "Escolha o que a pessoa é para você";
        };
        enviar.addEventListener("click", async () => {
          if (!alvo || !tipo) return;
          const ids = [eu.uid, alvo.uid].sort();
          const id = `${ids[0]}_${ids[1]}`;
          enviar.disabled = true;
          try {
            await fb.setDoc(fb.doc(fb.db, "vinculos", id), { participantes: ids, de: eu.uid, para: alvo.uid, tipoDe: tipo, tipoPara: INVERSO[tipo], status: "pendente", criadoEm: fb.serverTimestamp() });
            conexoes.push({ id, de: eu.uid, outro: alvo.uid, tipo, cat: TIPOS[tipo][1], pendente: true, perfil: alvo, aceitoEm: null, conheceram: "", frase: "", retrato: false });
            sair(); desenharTudo(); toast(`Pedido enviado para ${primeiroNome(alvo.nome)}`);
          } catch (e) { enviar.disabled = false; toast(e?.code === "permission-denied" ? "Não foi possível enviar: confirme seu e-mail ou veja se vocês já têm um pedido." : "Não foi possível enviar."); }
        });
        pintar();
      }, { grande: true, pe: true });
    }

    // ---------- Configurações do Social (gaveta) ----------
    const VIS = {
      todos: ["Todos", "Qualquer pessoa com conta abre os perfis do seu social."],
      seguidores: ["Seguidores", "Só quem segue você abre os perfis."],
      amigos: ["Amigos", "Só quem você segue e segue você."],
      ocultar: ["Ninguém", "Seu social fica escondido de todo mundo."]
    };
    function opcoes(lista, atual, aoEscolher) {
      const box = el("div", "ops"); box.setAttribute("role", "radiogroup");
      const pintar = (v) => box.querySelectorAll(".op").forEach((b) => { const on = b.dataset.v === v; b.classList.toggle("on", on); b.setAttribute("aria-checked", String(on)); });
      Object.entries(lista).forEach(([k, [nome, desc]]) => {
        const b = botao("op"); b.dataset.v = k; b.setAttribute("role", "radio");
        const tx = el("span", "tx"); tx.append(el("b", null, nome), el("small", null, desc));
        b.append(tx, el("span", "radio"));
        b.addEventListener("click", async () => { const antes = box.dataset.v; pintar(k); box.dataset.v = k; if (!(await aoEscolher(k))) { pintar(antes); box.dataset.v = antes; } });
        box.appendChild(b);
      });
      box.dataset.v = atual; pintar(atual);
      return box;
    }
    function secao(id, ic, titulo, texto) {
      const s = el("section", "cfg-sec"); if (id) s.id = id;
      const h = el("h4"); h.append(icone(ic, "i"), document.createTextNode(titulo));
      s.appendChild(h); if (texto) s.appendChild(el("p", null, texto));
      return s;
    }
    function abrirConfig(foco) {
      abrirFolha("Configurações do Social", (corpo) => {
        // 1) privacidade
        const priv = secao("cfgPrivacidade", "cadeado", "Quem pode abrir os perfis do seu social", "Quem não estiver liberado vê as fotos e os nomes, mas não abre os perfis. \"Ninguém\" esconde o social.");
        priv.appendChild(opcoes(VIS, dono.socialVisibilidade || "todos", async (v) => {
          try { await fb.setDoc(fb.doc(fb.db, "perfis_publicos", eu.uid), { uid: eu.uid, socialVisibilidade: v }, { merge: true }); dono.socialVisibilidade = v; toast("Privacidade atualizada"); return true; }
          catch { toast("Não foi possível salvar."); return false; }
        }));
        priv.lastChild.id = "visibilidade";
        // 2) duo no perfil
        const duo = secao("duoModos", "rosa", "Seu duo no perfil", "O que acontece quando alguém toca na rosinha da sua foto de perfil.");
        duo.classList.add("duo-modos");
        const grade = el("div", "dm-grade"); grade.id = "dmGrade"; grade.setAttribute("role", "radiogroup"); grade.setAttribute("aria-label", "Como o duo aparece no perfil");
        const clique = el("label", "dm-clique"); clique.id = "dmClique";
        const ctx = el("span", "tx"); const small = el("small"); small.id = "dmCliqueTx"; ctx.append(el("strong", null, "Tocar abre o perfil do duo"), small);
        const ch = el("span", "chave"); const inp = el("input"); inp.type = "checkbox"; inp.id = "dmCliqueIn"; ch.append(inp, el("span"));
        clique.append(ctx, ch);
        inp.addEventListener("change", (e) => { const a = lerModoDuo(modoDuo); mudarModoDuo(montarModoDuo(a.estilo, e.target.checked)); });
        const atual = el("p", "dm-atual"); atual.id = "dmAtual";
        duo.append(grade, clique, atual);
        // 3) presentes
        const pres = secao("cfgPresentes", "presente", "Quem pode me enviar presentes", "Você sempre pode recusar um presente. Seu endereço vai só para a loja que entrega.");
        const presBox = el("div"); presBox.appendChild(el("p", "aviso-add", "Carregando..."));
        pres.appendChild(presBox);
        fb.getDoc(fb.doc(fb.db, "pref_publicas", eu.uid)).then((s) => (s.exists() ? s.data().presentes : "")).catch(() => "").then((q) => {
          presBox.replaceChildren(opcoes(QUEM_PODE, QUEM_PODE[q] ? q : "seguindo", async (v) => {
            try { await fb.setDoc(fb.doc(fb.db, "pref_publicas", eu.uid), { presentes: v, atualizadoEm: fb.serverTimestamp() }, { merge: true }); toast("Salvo"); return true; }
            catch (e) { toast(e?.code === "permission-denied" ? "Esta opção ainda está sendo liberada." : "Não foi possível salvar."); return false; }
          }));
        });
        // 4) SOS e pets
        const n = aceitas().length;
        const sos = secao("cfgSos", "escudo", "SOS e rede de proteção", n ? `Quando você pede ajuda (SOS), as ${n} ${n === 1 ? "pessoa" : "pessoas"} do seu social recebem primeiro no Mensagens. Depois, se você escolher, quem está perto e a equipe de segurança.` : "Quando você pede ajuda (SOS), quem está no seu social recebe primeiro. Adicione família, amigos e o seu duo.");
        const links = el("div", "cfg-links");
        const a1 = el("a", "btn sec", "Configurar alertas"); a1.href = "alertas.html#config";
        const a2 = el("a", "btn sec", "Seus pets (RG do pet)"); a2.href = "alertas.html?aba=pets";
        links.append(a1, a2); sos.appendChild(links);
        corpo.append(priv, duo, pres, sos);
      }, { grande: true });
      desenharModosDuo();
      if (foco) requestAnimationFrame(() => document.getElementById(foco)?.scrollIntoView({ block: "start" }));
    }
    $("btnAdd").addEventListener("click", () => abrirAdicionar());

    // ---------- Seu duo no perfil: os 4 modelos com prévia ----------
    let modoDuo = "gaveta";
    function previaDuo(estilo, clique, duo) {
      const pv = el("div", "dm-prev"); pv.setAttribute("aria-hidden", "true");
      const eu2 = novoAvatar(dono.fotoPerfil, dono.nome); eu2.classList.add("dm-eu");
      const num = el("div", "dm-num"); num.append(el("i"), el("i"), el("i"));
      const lin = el("div", "dm-linhas"); lin.append(el("i"), el("i"));
      pv.append(eu2, num, lin);
      const fotoDuo = () => novoAvatar(duo?.perfil.fotoPerfil, duo?.perfil.nome || "Duo");
      if (estilo !== "ocultar") { const r = el("span", "dm-rosa" + (estilo === "rosa" ? " pulsa" : "")); r.appendChild(icone("rosa", "")); pv.appendChild(r); }
      if (estilo === "gaveta") { const g = el("div", "dm-gav" + (clique ? "" : " fixa")); const t = el("span"); t.append(el("i"), el("i")); g.append(fotoDuo(), t); pv.append(g, el("i", "dm-dedo")); }
      if (estilo === "bolinha") { const b = el("div", "dm-bol" + (clique ? "" : " fixa")); b.append(fotoDuo()); pv.append(b, el("i", "dm-dedo")); }
      if (estilo === "rosa") pv.appendChild(el("i", "dm-dedo"));
      if (estilo === "ocultar") pv.appendChild(el("span", "dm-nada", "Sem rosinha"));
      return pv;
    }
    function desenharModosDuo() {
      const box = $("dmGrade"); if (!box) return;
      box.replaceChildren();
      const atual = lerModoDuo(modoDuo);
      const duo = conexoes.find((x) => x.cat === "duo" && !x.pendente);
      ESTILOS_DUO.forEach((m) => {
        const b = el("button", "dm-op" + (atual.estilo === m.id ? " on" : "")); b.type = "button";
        b.setAttribute("role", "radio"); b.setAttribute("aria-checked", String(atual.estilo === m.id)); b.dataset.estilo = m.id;
        const clique = m.id === "gaveta" || m.id === "bolinha" ? atual.estilo === m.id ? atual.clique : true : false;
        const tx = el("span", "dm-tx"); const nm = el("span", "dm-nome"); nm.append(el("strong", null, m.nome), el("span", "radio"));
        tx.append(nm, el("small", null, m.texto));
        b.append(previaDuo(m.id, clique, duo), tx);
        b.addEventListener("click", () => {
          const vale = atual.estilo === "gaveta" || atual.estilo === "bolinha" ? atual.clique : true;
          mudarModoDuo(montarModoDuo(m.id, vale));
        });
        box.appendChild(b);
      });
      const comClique = atual.estilo === "gaveta" || atual.estilo === "bolinha";
      $("dmCliqueIn").checked = comClique && atual.clique;
      $("dmCliqueIn").disabled = !comClique;
      $("dmClique").classList.toggle("desligado", !comClique);
      $("dmCliqueTx").textContent = comClique ? (atual.estilo === "gaveta" ? "Tocar na gaveta abre o perfil do seu duo." : "Tocar na bolinha abre o perfil do seu duo.") : "Só na gaveta e na bolinha.";
      $("dmAtual").textContent = (duo ? "" : "Você ainda não tem um duo: a escolha vale quando tiver. ") + "Agora: " + textoModoDuo(modoDuo);
    }
    async function mudarModoDuo(valor) {
      if (valor === valorDuo(modoDuo)) return;
      const antes = modoDuo;
      modoDuo = valor; desenharModosDuo();
      try {
        const pub = await salvarModoDuo(fb, eu.uid, valor);
        dono.duoCapa = pub;
        toast(pub === valor ? "Pronto: " + ESTILOS_DUO.find((e) => e.id === lerModoDuo(valor).estilo).nome : "Salvo na sua conta. Para quem visita, vale depois da atualização das regras do site.");
      } catch { modoDuo = antes; desenharModosDuo(); toast("Não foi possível salvar."); }
    }

    function desenharTudo() {
      desenharHero(); desenharDuo(); desenharDestaques(); desenharCuidado(); desenharControles(); desenharRede();
      if (proprio) desenharModosDuo();
      $("redeSub").textContent = proprio && conexoes.some((c) => c.pendente && c.de !== eu.uid) ? "Você tem pedidos para responder." : "Organize e encontre rapidamente suas pessoas.";
    }

    async function iniciar() {
      for (let i = 0; i < 100 && (!window.firebaseAuth || !window.firebaseDb); i++) await new Promise((r) => setTimeout(r, 50));
      if (!window.firebaseAuth) { estado("Não foi possível conectar", "Abra esta página pelo site."); return; }
      const [auth, firestore] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")
      ]);
      fb = { ...firestore, db: window.firebaseDb };
      auth.onAuthStateChanged(window.firebaseAuth, async (u) => {
        if (!u) { if (window.__hfIrLogin) window.__hfIrLogin(); else location.href = "login.html"; return; }
        if (eu) return;
        eu = u;
        donoId = new URLSearchParams(location.search).get("uid") || eu.uid;
        proprio = donoId === eu.uid;
        if (!proprio) $("btnVoltar").href = `usuarios.html?perfil=${encodeURIComponent(donoId)}`;
        try {
          if (!proprio) {
            const [b1, b2] = await Promise.all([
              fb.getDoc(fb.doc(fb.db, "bloqueios", `${donoId}_${eu.uid}`)).then((s) => s.exists()).catch(() => false),
              fb.getDoc(fb.doc(fb.db, "bloqueios", `${eu.uid}_${donoId}`)).then((s) => s.exists()).catch(() => false)
            ]);
            if (b1 || b2) { estado("Social indisponível", "Não é possível ver este social."); return; }
          }
          const [s, c] = await Promise.all([
            fb.getDoc(fb.doc(fb.db, "perfis_publicos", donoId)),
            proprio ? fb.getDoc(fb.doc(fb.db, "usuarios", eu.uid)).then((d) => (d.exists() ? d.data() : {})).catch(() => ({})) : null
          ]);
          dono = s.exists() ? s.data() : {};
          conta = c;
          $("titulo").textContent = proprio ? "Meu social" : `Social de ${primeiroNome(dono.nome)}`;
          $("tituloSub").textContent = dono.nickname ? "@" + dono.nickname : "";
          $("btnAdd").hidden = !proprio; $("btnAddEspaco").hidden = proprio;
          document.title = `${$("titulo").textContent} | Help Floripa`;
          if (!proprio && (dono.socialVisibilidade || "todos") === "ocultar") { estado("Social privado", "Esta pessoa preferiu não mostrar o social."); return; }
          clicavel = await podeAbrirPerfis();
          // Social de outra pessoa: só vínculos aceitos (pedidos pendentes são privados pelas regras).
          const filtros = [fb.where("participantes", "array-contains", donoId)];
          if (!proprio) filtros.push(fb.where("status", "==", "aceito"));
          const snap = await fb.getDocs(fb.query(fb.collection(fb.db, "vinculos"), ...filtros, fb.limit(60)));
          const brutos = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          const perfis = await Promise.all(brutos.map((v) => {
            const outro = (v.participantes || []).find((x) => x !== donoId);
            return fb.getDoc(fb.doc(fb.db, "perfis_publicos", outro)).then((p) => (p.exists() ? p.data() : {})).catch(() => ({}));
          }));
          const locais = (proprio && conta?.socialMemorias) || {};
          conexoes = brutos.map((v, i) => {
            const outro = (v.participantes || []).find((x) => x !== donoId);
            const tipo = donoId === v.de ? v.tipoDe : v.tipoPara;
            // Memória guardada só na sua conta (antes da atualização das regras) vale enquanto o vínculo não tem a dele.
            const loc = !v.memoriaEm && locais[v.id] ? locais[v.id] : {};
            return { id: v.id, de: v.de, outro, tipo, cat: TIPOS[tipo]?.[1] || "amizade", pendente: v.status !== "aceito", perfil: perfis[i], aceitoEm: v.aceitoEm,
              conheceram: v.conheceram || loc.conheceram || "", frase: v.frase || loc.frase || "", retrato: !!v.retrato };
          }).filter((c) => proprio || !c.pendente);

          $("estado").hidden = true;
          $("conteudo").hidden = false;
          if (!proprio && !clicavel) {
            $("nota").hidden = false;
            $("nota").textContent = dono.socialVisibilidade === "amigos" ? "Os perfis abrem só para amigos (quem segue e é seguido)." : "Os perfis abrem só para seguidores.";
          }
          if (proprio) modoDuo = valorDuo(duoDaConta(conta?.duoCapa, dono.duoCapa));
          desenharTudo();
          if (proprio && ["#duoModos", "#privacidade", "#config"].includes(location.hash)) abrirConfig(location.hash === "#duoModos" ? "duoModos" : "");
          contarRede();
          carregarPets().then(() => { if (pets.size) desenharTudo(); });
        } catch (e) {
          console.error(e);
          estado("Não foi possível carregar", "Tente novamente em instantes.");
        }
      });
    }
    iniciar();
  </script>
</body>
</html>
