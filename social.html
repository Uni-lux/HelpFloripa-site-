  <style>
    /* =====================================================================================================
       Social (16/11/2026, 6ª versão, pedido dele com um modelo em HTML: "usa algo assim"): cartão do perfil com os números,
       o link do duo (Akai Ito: NÃO mexer, ele aprovou), conexões em destaque (fileira), filtros com contagem + ordenação,
       cartões das conexões (Ver perfil · Mensagem) e, para o dono, como o duo aparece no perfil. Cores e letras da rede.
       NÃO voltar a gótico/radar/coração/sistema solar.
       ===================================================================================================== */
    :root {
      --accent: #00adee; --accent-ink: #001a24; --danger: #e5484d;
      --duo: #ff4d6d; --familia: #f5b301; --amizade: #00adee; --trabalho: #2fbf71;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --ceu: #01050a; --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    }
    :root[data-theme="dark"] { --bg: #000; --panel: #0b0e11; --panel-2: #14191d; --hover: #171d22; --line: rgba(255, 255, 255, .1); --text: #eef3f6; --muted: #8b9aa5; --overlay: rgba(0, 0, 0, .7); --sombra: 0 18px 50px rgba(0, 0, 0, .5); }
    :root[data-theme="light"] { --bg: #f2f4f6; --panel: #fff; --panel-2: #f4f6f8; --hover: #eef2f5; --line: #e4e9ed; --text: #0e1a21; --muted: #607380; --overlay: rgba(10, 20, 26, .5); --sombra: 0 18px 50px rgba(15, 30, 40, .12); }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { overflow-x: clip; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; }
    a { color: inherit; }
    svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    svg.i.s { width: 16px; height: 16px; }
    [data-cat="duo"] { --cor: var(--duo); }
    [data-cat="familia"] { --cor: var(--familia); }
    [data-cat="amizade"] { --cor: var(--amizade); }
    [data-cat="trabalho"] { --cor: var(--trabalho); }
    .icone-btn { position: relative; width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--text); text-decoration: none; }
    @media (hover: hover) { .icone-btn:hover { background: var(--hover); } }
    .icone-btn.vazio { pointer-events: none; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; background: linear-gradient(135deg, #0a4a63, #00adee); color: #fff; display: grid; place-items: center; font-weight: 750; flex-shrink: 0; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* topo */
    .topo { position: sticky; top: 0; z-index: 1200; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 4px;
      height: calc(54px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 6px 0; background: var(--panel); border-bottom: 1px solid var(--line); }
    :root[data-theme="dark"] .topo { background: #000; border-bottom-color: rgba(255, 255, 255, .12); }
    .topo-tit { margin: 0; min-width: 0; display: grid; justify-items: center; line-height: 1.15; }
    .topo-tit span { font-size: 16.5px; font-weight: 800; letter-spacing: -.2px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topo-tit small { font-size: 12px; font-weight: 600; color: var(--muted); }
    .topo-tit small:empty { display: none; }

    .pg { width: min(760px, 100%); margin: 0 auto; padding: 0 0 calc(40px + env(safe-area-inset-bottom)); }
    #conteudo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
    .estado { padding: 80px 20px; text-align: center; color: var(--muted); }
    .estado strong { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }

    /* ---------- cartão do perfil, destaques, filtros e conexões (modelo dele, 16/11) ---------- */
    :root { --head: "Manrope", var(--font); }
    h1, h2, h3, .hs-stats b, .ceu-total { font-family: var(--head); }
    .hero-social { position: relative; overflow: hidden; margin: 10px 10px 0; padding: 18px; border-radius: 22px; isolation: isolate;
      border: 1px solid color-mix(in srgb, var(--accent) 36%, var(--line));
      background: linear-gradient(115deg, color-mix(in srgb, var(--accent) 15%, var(--panel)) 0%, var(--panel) 56%, color-mix(in srgb, #a65a9a 9%, var(--panel)) 100%); }
    .hero-social::before { content: ""; position: absolute; z-index: -1; width: 320px; height: 320px; right: -110px; top: -190px; border-radius: 50%; pointer-events: none;
      border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent); box-shadow: 0 0 0 24px color-mix(in srgb, var(--accent) 5%, transparent), 0 0 0 54px color-mix(in srgb, var(--accent) 3%, transparent); }
    @media (min-width: 700px) { .hero-social { margin: 14px 14px 0; padding: 22px; } }
    .hs-topo { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .hs-av { width: 72px; height: 72px; border-radius: 22px; font-size: 24px; border: 2px solid color-mix(in srgb, var(--accent) 75%, #fff); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 12%, transparent); }
    .hs-info { min-width: 0; flex: 1; }
    .hs-info h2 { margin: 0; display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 800; letter-spacing: -.5px; line-height: 1.2; }
    .hs-info h2 span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .selo-v { width: 17px; height: 17px; flex: none; color: #1d9bf0; fill: currentColor; stroke: none; }
    .hs-nick { margin-top: 3px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hs-bio { margin: 8px 0 0; font-size: 13px; line-height: 1.45; color: color-mix(in srgb, var(--text) 78%, var(--muted)); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .hs-bio:empty { display: none; }
    .hs-acoes { display: flex; gap: 8px; margin-top: 14px; }
    .hs-acoes button, .hs-acoes a { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 11px; text-decoration: none;
      border: 1px solid var(--line); background: color-mix(in srgb, var(--text) 5%, transparent); color: var(--text); font-size: 12.5px; font-weight: 700; cursor: pointer; }
    @media (hover: hover) { .hs-acoes button:hover, .hs-acoes a:hover { background: var(--hover); } }
    .hs-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
    .hs-stat { display: grid; gap: 2px; justify-items: center; padding: 0 4px; border: 0; background: none; color: inherit; font: inherit; }
    button.hs-stat { cursor: pointer; }
    .hs-stat + .hs-stat { border-left: 1px solid var(--line); }
    .hs-stat b { font-size: 19px; font-weight: 800; line-height: 1.2; }
    .hs-stat span { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .sec-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 16px 10px; }
    .sec-cab h3 { margin: 0; font-size: 16.5px; font-weight: 800; letter-spacing: -.3px; }
    .sec-cab p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
    .sec-cab button { border: 0; background: none; color: var(--accent); font-size: 12.5px; font-weight: 700; cursor: pointer; padding: 6px 0; white-space: nowrap; }
    .destaques { display: flex; gap: 12px; overflow-x: auto; padding: 2px 16px 6px; scrollbar-width: none; scroll-padding: 16px; }
    .destaques::-webkit-scrollbar { display: none; }
    .dest { flex: none; width: 72px; display: grid; justify-items: center; gap: 2px; padding: 0; border: 0; background: none; color: var(--text); text-align: center; cursor: pointer; }
    .dest[disabled] { cursor: default; }
    .dest .anel { width: 62px; height: 62px; margin-bottom: 5px; padding: 3px; border-radius: 20px; background: linear-gradient(140deg, var(--cor), color-mix(in srgb, var(--cor) 40%, #6b4fb0)); }
    .dest .anel .avatar { width: 100%; height: 100%; border-radius: 17px; font-size: 16px; box-shadow: 0 0 0 3px var(--bg); }
    .dest strong { max-width: 72px; font-size: 11.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dest small { max-width: 72px; font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dest.pend { opacity: .55; }
    .dest.novo .anel { background: none; border: 1.5px dashed color-mix(in srgb, var(--accent) 70%, transparent); display: grid; place-items: center; color: var(--accent); padding: 0; }
    .dest.novo .anel svg { width: 24px; height: 24px; }
    @media (hover: hover) { .dest:not([disabled]):hover .anel { transform: translateY(-2px); } }
    .dest .anel { transition: transform .15s; }
    .controles { display: flex; align-items: center; gap: 8px; padding: 0 16px; }
    .chips { flex: 1; min-width: 0; display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chips button { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted);
      font-size: 12px; font-weight: 750; white-space: nowrap; cursor: pointer; }
    .chips button i { width: 7px; height: 7px; border-radius: 50%; background: var(--cor); }
    .chips button b { font-size: 11.5px; font-weight: 800; color: var(--text); opacity: .7; }
    .chips button.on { color: var(--text); border-color: color-mix(in srgb, var(--cor, var(--accent)) 60%, transparent); background: color-mix(in srgb, var(--cor, var(--accent)) 13%, var(--panel)); }
    .ordem { flex: none; max-width: 120px; height: 34px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 12px; font-weight: 650; }
    .rede { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 12px 12px 0; }
    @media (max-width: 380px) { .rede { grid-template-columns: minmax(0, 1fr); } }
    .pessoa { position: relative; min-width: 0; display: flex; flex-direction: column; padding: 13px 12px 12px; border-radius: 17px; border: 1px solid var(--line); background: var(--panel); transition: transform .15s, border-color .15s; }
    .pessoa::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 2px; border-radius: 0 0 2px 2px; background: var(--cor); opacity: .85; }
    @media (hover: hover) { .pessoa:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--cor) 45%, var(--line)); } }
    .pessoa.pend { opacity: .85; border-style: dashed; }
    .pessoa.pend::before { background: repeating-linear-gradient(90deg, var(--cor) 0 5px, transparent 5px 9px); }
    .pe-topo { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .pe-av { position: relative; flex: none; }
    .pe-av .avatar { width: 40px; height: 40px; font-size: 14px; box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--cor); }
    .pe-av .on { position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; background: #40d6a0; box-shadow: 0 0 0 2.5px var(--panel); }
    .pe-nome { min-width: 0; flex: 1; }
    .pe-nome b { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 800; line-height: 1.25; }
    .pe-nome b span { min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .pe-nome small { display: block; margin-top: 2px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pe-texto { margin: 10px 0 0; min-height: 31px; font-size: 11.5px; line-height: 1.4; color: color-mix(in srgb, var(--text) 70%, var(--muted)); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .pe-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
    .pe-tag { padding: 3px 8px; border-radius: 7px; font-size: 10px; font-weight: 700; color: color-mix(in srgb, var(--cor) 78%, var(--text)); background: color-mix(in srgb, var(--cor) 13%, transparent); }
    .pe-tag.neutra { color: var(--muted); background: var(--panel-2); }
    .pe-pes { display: flex; gap: 6px; margin-top: auto; padding-top: 12px; }
    .pe-pes button { flex: 1; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 34px; padding: 0 6px; border-radius: 10px; font-size: 11.5px; font-weight: 750; cursor: pointer;
      border: 1px solid var(--line); background: var(--panel-2); color: var(--text); white-space: nowrap; }
    .pe-pes button svg { width: 15px; height: 15px; }
    .pe-pes button.msg { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
    .pessoa > button.mais { display: grid; place-items: center; cursor: pointer; position: absolute; right: 8px; top: 9px; flex: none; width: 28px; height: 28px; padding: 0; border: 0; background: none; color: var(--muted); }
    .pessoa.com-mais .pe-nome { padding-right: 18px; }
    .pe-pes button[disabled] { opacity: .45; cursor: default; }
    .vazio-rede { grid-column: 1 / -1; padding: 30px 16px; text-align: center; color: var(--muted); font-size: 13.5px; border: 1px dashed var(--line); border-radius: 17px; }
    .vazio-rede a { color: var(--accent); font-weight: 700; }
    .ceu-total { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .nota { margin: 0 16px; text-align: center; color: var(--muted); font-size: 13px; }

    /* ---------- Akai Ito (duo), 7ª versão (16/11/2026, pedido dele): cartão organizado, sem "conectados pelo fio vermelho",
       frase de vocês (ou uma da lenda), data em que se conheceram, tempo juntos e o retrato dos dois. ---------- */
    .akai { position: relative; margin: 0 14px; padding: 16px 16px 14px; border-radius: 22px; overflow: hidden; color: #fff; isolation: isolate;
      background: radial-gradient(120% 80% at 50% 0%, rgba(255, 77, 109, .24), transparent 62%), linear-gradient(172deg, #1c0811 0%, #0d0509 58%, #08060a 100%);
      border: 1px solid rgba(255, 77, 109, .34); box-shadow: 0 16px 40px rgba(70, 0, 18, .22); }
    .akai::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(55% 45% at 100% 100%, rgba(255, 77, 109, .1), transparent 72%), radial-gradient(40% 35% at 0% 100%, rgba(255, 140, 160, .06), transparent 72%); }
    .ak-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 30px; }
    .ak-rot { display: flex; align-items: center; gap: 7px; min-width: 0; font: 800 11px/1 var(--head); letter-spacing: 1.6px; text-transform: uppercase; color: #ff9fb0; }
    .ak-rot svg { width: 15px; height: 15px; color: #ff4d6d; }
    .ak-rot small { font: 700 10.5px/1 var(--font); letter-spacing: .2px; text-transform: none; color: rgba(255, 222, 230, .72); padding: 5px 9px; border-radius: 99px; background: rgba(255, 255, 255, .07); white-space: nowrap; }
    .ak-edit { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 99px; border: 1px solid rgba(255, 255, 255, .16); background: rgba(255, 255, 255, .07); color: #fff; font-size: 12px; font-weight: 750; cursor: pointer; }
    .ak-edit svg { width: 14px; height: 14px; }
    @media (hover: hover) { .ak-edit:hover { background: rgba(255, 255, 255, .13); } }
    .ak-retrato { position: relative; display: block; width: 100%; margin: 14px 0 0; padding: 0; border: 1px solid rgba(255, 255, 255, .08); border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; max-height: 300px; background: #160a0f; cursor: zoom-in; }
    .ak-retrato img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ak-retrato::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 60%, rgba(8, 4, 7, .55)); pointer-events: none; }
    .akai-par { position: relative; display: flex; align-items: center; justify-content: space-between; margin: 16px 6px 12px; }
    .akai-fio { position: absolute; left: 44px; right: 44px; top: 4px; height: 50px; overflow: visible; pointer-events: none; }
    .akai-fio path.linha { fill: none; stroke: #ff4d6d; stroke-width: 1.6; stroke-linecap: round; filter: drop-shadow(0 0 5px rgba(255, 77, 109, .95)); }
    .akai-fio path.linha.b { stroke: rgba(255, 140, 160, .45); stroke-width: 1; }
    .akai-fio path.brilho { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 14 400; animation: correr 2.6s linear infinite; }
    @keyframes correr { from { stroke-dashoffset: 420; } to { stroke-dashoffset: 0; } }
    .akai-cor { position: absolute; left: 50%; top: 14px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; transform: translateX(-50%); z-index: 2;
      background: #fff; color: #e0243b; box-shadow: 0 0 0 4px rgba(255, 77, 109, .2), 0 0 22px rgba(255, 77, 109, .9); }
    .akai-cor svg { width: 18px; height: 18px; }
    .akai-pessoa { position: relative; z-index: 2; display: grid; justify-items: center; gap: 6px; width: 96px; padding: 0; border: 0; background: none; color: #fff; cursor: pointer; }
    .akai-pessoa[disabled] { cursor: default; }
    .ak-av { position: relative; }
    .akai-pessoa .avatar { width: 58px; height: 58px; font-size: 18px; box-shadow: 0 0 0 2.5px #14060c, 0 0 0 4px #ff4d6d, 0 0 26px rgba(255, 77, 109, .45); }
    .akai-pessoa strong { max-width: 96px; font: 800 14px/1.2 var(--head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .akai-pessoa em { margin-top: -3px; font-size: 10.5px; font-weight: 700; font-style: normal; color: #ff9fb0; }
    .ak-frase { margin: 0 4px; text-align: center; font: 600 15px/1.5 var(--head); letter-spacing: -.1px; color: #ffe9ee; text-wrap: balance; overflow-wrap: anywhere; }
    .ak-frase::before, .ak-frase::after { color: #ff4d6d; font-weight: 800; }
    .ak-frase::before { content: "“"; margin-right: 1px; }

    const deISO = (s) => (/^\d{4}-\d{2}-\d{2}$/.test(s || "") ? new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) : null);

    function tempoDesde(d) {
      const a = new Date();
      let meses = (a.getFullYear() - d.getFullYear()) * 12 + (a.getMonth() - d.getMonth());
      if (a.getDate() < d.getDate()) meses--;
      if (meses < 1) { const dias = Math.max(0, Math.floor((a - d) / 864e5)); return dias === 1 ? "1 dia" : `${dias} dias`; }
      const anos = Math.floor(meses / 12), m = meses % 12;
      const tA = anos ? (anos === 1 ? "1 ano" : `${anos} anos`) : "", tM = m ? (m === 1 ? "1 mês" : `${m} meses`) : "";

    // ---------- Memória de vocês: data, frase e retrato (um dos dois edita; aparece nos dois socials) ----------
    function reduzirRetrato(arquivo) {
      return new Promise((ok, erro) => {
        const url = URL.createObjectURL(arquivo);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          let lado = 1100, q = 0.82, saida = "";
          for (let i = 0; i < 8; i++) {
            const k = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
            const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            saida = c.toDataURL("image/jpeg", q);
            if (saida.length <= 230000) break;
            if (q > 0.6) q -= 0.08; else lado = Math.round(lado * 0.8);
          }
          saida.length <= 230000 ? ok(saida) : erro(new Error("grande"));
        };
        img.onerror = () => { URL.revokeObjectURL(url); erro(new Error("imagem")); };
        img.src = url;
      });
    }

        op("foto", "#00adee", "Momento com foto", resta("fotos") > 0 ? `Uma foto que marcou · cabem mais ${resta("fotos")}` : `Galeria cheia (${LIMITES_SALAO.fotos} fotos)`, () => abrirEditorMomento(null, "foto"), "crFoto");
        op("estrela", "#f5b301", "Destaque do Flash", "Junte flashes que ficam no diário para sempre", () => { location.href = "usuarios.html?acao=destaque"; }, "crDq");
        op("pessoas", "#2fbf71", "Pessoa ao seu social", "Duo, família, amigos e colegas", () => abrirAdicionar(), "crPessoa");
      });
    }

    function desenharTudo() {
      desenharHero(); desenharDuo(); desenharSalao(); desenharDestaques(); desenharCuidado(); desenharControles(); desenharRede();
      $("nConAba").textContent = String(aceitas().length);
      if (proprio) desenharModosDuo();
    }

    async function iniciar() {
      for (let i = 0; i < 100 && (!window.firebaseAuth || !window.firebaseDb); i++) await new Promise((r) => setTimeout(r, 50));
      if (!window.firebaseAuth) { estado("Não foi possível conectar", "Abra esta página pelo site."); return; }
      const [auth, firestore] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")
      ]);
      fb = { ...firestore, db: window.firebaseDb };
      auth.onAuthStateChanged(window.firebaseAuth, async (u) => {
        if (!u) { if (window.__hfIrLogin) window.__hfIrLogin(); else location.href = "login.html"; return; }
        if (eu) return;
        eu = u;
        donoId = new URLSearchParams(location.search).get("uid") || eu.uid;
        proprio = donoId === eu.uid;
        if (!proprio) $("btnVoltar").href = `usuarios.html?perfil=${encodeURIComponent(donoId)}`;
        try {
          if (!proprio) {
            const [b1, b2] = await Promise.all([
              fb.getDoc(fb.doc(fb.db, "bloqueios", `${donoId}_${eu.uid}`)).then((s) => s.exists()).catch(() => false),
              fb.getDoc(fb.doc(fb.db, "bloqueios", `${eu.uid}_${donoId}`)).then((s) => s.exists()).catch(() => false)
            ]);
            if (b1 || b2) { estado("Social indisponível", "Não é possível ver este social."); return; }
          }
          const [s, c] = await Promise.all([
            fb.getDoc(fb.doc(fb.db, "perfis_publicos", donoId)),
            proprio ? fb.getDoc(fb.doc(fb.db, "usuarios", eu.uid)).then((d) => (d.exists() ? d.data() : {})).catch(() => ({})) : null
          ]);
          dono = s.exists() ? s.data() : {};
          conta = c;
          $("titulo").textContent = proprio ? "Meu diário" : `Diário de ${primeiroNome(dono.nome)}`;
          $("tituloSub").textContent = dono.nickname ? "@" + dono.nickname : "";
          $("btnAdd").hidden = !proprio; $("btnAddEspaco").hidden = proprio;
          document.title = `${$("titulo").textContent} | Help Floripa`;
          // "Ninguém" esconde as conexões; o Salão segue o "quem vê" de cada momento.
          socialOculto = !proprio && (dono.socialVisibilidade || "todos") === "ocultar";
          rel = await relacaoCom(fb, eu.uid, donoId);
          clicavel = await podeAbrirPerfis();
          const salaoP = Promise.all([lerMomentos(fb, eu.uid, donoId, rel, { limite: MAX_MOMENTOS }), lerDestaquesFlash(fb, donoId)]);
          // Social de outra pessoa: só vínculos aceitos (pedidos pendentes são privados pelas regras).
          const filtros = [fb.where("participantes", "array-contains", donoId)];
          if (!proprio) filtros.push(fb.where("status", "==", "aceito"));
          const snap = socialOculto ? { docs: [] } : await fb.getDocs(fb.query(fb.collection(fb.db, "vinculos"), ...filtros, fb.limit(60)));
          [momentos, dqs] = await salaoP;
          const brutos = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          const perfis = await Promise.all(brutos.map((v) => {
            const outro = (v.participantes || []).find((x) => x !== donoId);
            return fb.getDoc(fb.doc(fb.db, "perfis_publicos", outro)).then((p) => (p.exists() ? p.data() : {})).catch(() => ({}));
          }));
          const locais = (proprio && conta?.socialMemorias) || {};
          conexoes = brutos.map((v, i) => {
            const outro = (v.participantes || []).find((x) => x !== donoId);
            const tipo = donoId === v.de ? v.tipoDe : v.tipoPara;
            // Memória guardada só na sua conta (antes da atualização das regras) vale enquanto o vínculo não tem a dele.
            const loc = !v.memoriaEm && locais[v.id] ? locais[v.id] : {};
            return { id: v.id, de: v.de, outro, tipo, cat: TIPOS[tipo]?.[1] || "amizade", pendente: v.status !== "aceito", perfil: perfis[i], aceitoEm: v.aceitoEm,
              conheceram: v.conheceram || loc.conheceram || "", frase: v.frase || loc.frase || "", retrato: !!v.retrato };
          }).filter((c) => proprio || !c.pendente);

          $("estado").hidden = true;
          $("conteudo").hidden = false;
          if (!proprio && !clicavel) {
            $("nota").hidden = false;
            $("nota").textContent = dono.socialVisibilidade === "amigos" ? "Os perfis abrem só para amigos (quem segue e é seguido)." : "Os perfis abrem só para seguidores.";
          }
          if (proprio) modoDuo = valorDuo(duoDaConta(conta?.duoCapa, dono.duoCapa));
          modeloGal = modeloGaleria((proprio && conta?.salaoModelo) || (await fb.getDoc(fb.doc(fb.db, "pref_publicas", donoId)).then((d) => d.data()?.salaoModelo).catch(() => "")));
          if (socialOculto) { ["secDest", "secRede"].forEach((x) => ($(x).hidden = true)); $("notaOculto").hidden = false; }
          desenharTudo();
          if (socialOculto) $("secDest").hidden = true;
          irAba(new URLSearchParams(location.search).get("aba") === "conexoes" ? "conexoes" : "salao", false);
          if (proprio && ["#duoModos", "#privacidade", "#config"].includes(location.hash)) abrirConfig(location.hash === "#duoModos" ? "duoModos" : "");
          contarRede();
          carregarPets().then(() => { if (pets.size) desenharTudo(); });
        } catch (e) {
          console.error(e);
          estado("Não foi possível carregar", "Tente novamente em instantes.");
        }
      });
    }
    iniciar();
  </script>
</body>
</html>
