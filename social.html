<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b1014" />
  <title>Social | Help Floripa</title>
  <!-- O Social agora é uma seção do perfil (usuarios.html?aba=social). Links antigos continuam funcionando. -->
  <script>
    (function () {
      var p = new URLSearchParams(location.search), uid = p.get("uid");
      location.replace("usuarios.html?" + (uid ? "perfil=" + encodeURIComponent(uid) + "&" : "") + "aba=social");
    })();
  </script>
  <style>body { margin: 0; background: #070b0e; }</style>
</head>
<body></body>
</html>
