  <style>
    /* =====================================================================================================
       Social (14/11/2026, pedido dele): um céu escuro com a pessoa no centro de um coração, as conexões no contorno ligadas a
       ela por fios finos (a cor diz o grupo), o duo no alto pelo fio vermelho do Akai Ito, filtros com contagem e cada grupo
       em cartões pequenos, 4 por linha, que deslizam para o lado. O céu fica escuro também no tema claro.
       ===================================================================================================== */
    :root {
      --accent: #00adee; --accent-ink: #001a24; --danger: #e5484d;
      --duo: #ff4d6d; --familia: #f5b301; --amizade: #00adee; --trabalho: #2fbf71;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --ceu: #04070b;
    }
    :root[data-theme="dark"] { --bg: #000; --panel: #0b0e11; --panel-2: #14191d; --hover: #171d22; --line: rgba(255, 255, 255, .1); --text: #eef3f6; --muted: #8b9aa5; --overlay: rgba(0, 0, 0, .7); --sombra: 0 18px 50px rgba(0, 0, 0, .5); }
    :root[data-theme="light"] { --bg: #f2f4f6; --panel: #fff; --panel-2: #f4f6f8; --hover: #eef2f5; --line: #e4e9ed; --text: #0e1a21; --muted: #607380; --overlay: rgba(10, 20, 26, .5); --sombra: 0 18px 50px rgba(15, 30, 40, .12); }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { overflow-x: clip; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; }
    a { color: inherit; }
    svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    svg.i.s { width: 16px; height: 16px; }
    [data-cat="duo"] { --cor: var(--duo); }
    [data-cat="familia"] { --cor: var(--familia); }
    [data-cat="amizade"] { --cor: var(--amizade); }
    [data-cat="trabalho"] { --cor: var(--trabalho); }
    .icone-btn { position: relative; width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--text); text-decoration: none; }
    @media (hover: hover) { .icone-btn:hover { background: var(--hover); } }
    .icone-btn.vazio { pointer-events: none; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; background: linear-gradient(135deg, #0a4a63, #00adee); color: #fff; display: grid; place-items: center; font-weight: 750; flex-shrink: 0; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* topo */
    .topo { position: sticky; top: 0; z-index: 1200; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 4px;
      height: calc(54px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 6px 0; background: var(--panel); border-bottom: 1px solid var(--line); }
    :root[data-theme="dark"] .topo { background: #000; border-bottom-color: rgba(255, 255, 255, .12); }
    .topo-tit { margin: 0; min-width: 0; display: grid; justify-items: center; line-height: 1.15; }
    .topo-tit span { font-size: 16.5px; font-weight: 800; letter-spacing: -.2px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topo-tit small { font-size: 12px; font-weight: 600; color: var(--muted); }
    .topo-tit small:empty { display: none; }

    .pg { width: min(760px, 100%); margin: 0 auto; padding: 0 0 calc(40px + env(safe-area-inset-bottom)); }
    #conteudo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
    .estado { padding: 80px 20px; text-align: center; color: var(--muted); }
    .estado strong { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }

    /* ---------- o céu ---------- */
    .ceu { position: relative; overflow: hidden; color: #fff; background: var(--ceu); padding: 10px 0 22px; isolation: isolate; }
    @media (min-width: 700px) { .ceu { margin: 14px 14px 0; border-radius: 28px; } }
    .ceu-fundo { position: absolute; inset: -40px; z-index: -3; background: #06202c url("ponte-help.webp") center / cover; filter: blur(40px) saturate(1.2); opacity: .12; transform: scale(1.1); }
    .ceu::before { content: ""; position: absolute; inset: 0; z-index: -2; pointer-events: none;
      background:
        radial-gradient(42% 38% at 18% 22%, rgba(88, 60, 200, .22), transparent 70%),
        radial-gradient(40% 34% at 86% 30%, rgba(0, 173, 238, .16), transparent 70%),
        radial-gradient(50% 40% at 70% 92%, rgba(255, 77, 109, .12), transparent 70%),
        radial-gradient(55% 45% at 50% 40%, rgba(255, 190, 90, .10), transparent 70%),
        linear-gradient(180deg, #03050b, #070b18 55%, #04060c); }
    .ceu-estrelas { position: absolute; left: 0; top: 0; z-index: -1; pointer-events: none; }
    /* Painel das conexões (14/11, pedido dele: romântico e elegante): a pessoa no centro, as conexões pousadas no contorno de
       um coração e ligadas a ela por fios finos (o duo no alto, pelo fio vermelho). Nada gira: só flutuam de leve. */
    .orbita { position: relative; width: min(100%, 440px); margin: 0 auto; touch-action: pan-y; }
    .orbita > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 1; }
    .orbita .coracao { fill: none; stroke: #ff7a93; stroke-width: 1; stroke-dasharray: 1 6; stroke-linecap: round; opacity: .38; }
    .orbita .coracao-luz { fill: url(#luzCoracao); stroke: none; }
    .orbita .fio { fill: none; stroke-width: 1; stroke-linecap: round; opacity: .42; transition: opacity .25s; }
    .orbita .fio.duo { stroke-width: 1.6; opacity: .9; filter: drop-shadow(0 0 3px rgba(255, 77, 109, .9)); }
    .orbita .fio.pend { stroke-dasharray: 3 4; opacity: .28; }
    .orbita .fio.apagado, .orbita .gota.apagado { opacity: .06; }
    .orbita .gota { opacity: .95; }
    .astro { position: absolute; left: 0; top: 0; z-index: 5; display: grid; justify-items: center; gap: 3px; width: 64px; padding: 0; border: 0; background: none; color: #fff;
      cursor: pointer; will-change: transform; transition: opacity .25s; }
    .astro[disabled] { cursor: default; }
    .astro .avatar { width: 38px; height: 38px; font-size: 12px; box-shadow: 0 0 0 2px #070912, 0 0 0 3.2px var(--cor), 0 4px 14px rgba(0, 0, 0, .5); }
    .astro span { max-width: 64px; font-size: 10.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: rgba(255, 255, 255, .88); text-shadow: 0 1px 5px #000; }
    .astro.duo .avatar { width: 44px; height: 44px; box-shadow: 0 0 0 2px #070912, 0 0 0 3.6px var(--duo), 0 0 22px rgba(255, 77, 109, .7); }
    .astro.duo span { color: #ffb3c1; font-weight: 750; }
    .astro.pend { opacity: .6; }
    .astro.pend .avatar { filter: grayscale(.5); box-shadow: 0 0 0 2px #070912, 0 0 0 3px color-mix(in srgb, var(--cor) 50%, transparent); }
    .astro.apagado { opacity: .1 !important; pointer-events: none; }
    .astro.centro { width: 110px; cursor: default; z-index: 20; }
    .astro.centro .avatar { position: relative; width: 70px; height: 70px; font-size: 22px; box-shadow: 0 0 0 3px #070912, 0 0 0 4.5px rgba(255, 179, 193, .9), 0 0 30px rgba(255, 77, 109, .55); }
    .centro .halo { position: absolute; left: 50%; top: 35px; width: 150px; height: 150px; border-radius: 50%; transform: translate(-50%, -50%); z-index: -1; pointer-events: none;
      background: radial-gradient(circle, rgba(255, 120, 150, .34) 0%, rgba(255, 77, 109, .14) 32%, transparent 66%); }
    .ceu-id { text-align: center; margin-top: 4px; padding: 0 16px; }
    .ceu-id h2 { margin: 0; font-size: 24px; font-weight: 850; letter-spacing: -.4px; }
    .ceu-id p { margin: 3px 0 0; font-size: 13.5px; color: rgba(255, 255, 255, .62); }
    .ceu-total { display: flex; align-items: center; gap: 8px; margin: 14px auto 0; padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .16);
      background: rgba(255, 255, 255, .06); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: #fff; font-size: 13.5px; font-weight: 700; cursor: pointer; }
    .ceu-total b { font-size: 15px; }
    .ceu-vazio { position: absolute; left: 0; right: 0; bottom: 14%; margin: 0; text-align: center; color: rgba(255, 255, 255, .7); font-size: 13.5px; }

    /* ---------- filtros ---------- */
    .filtros { display: flex; gap: 8px; overflow-x: auto; padding: 2px 14px; scrollbar-width: none; }
    .filtros::-webkit-scrollbar { display: none; }
    .filtros button { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
      font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; }
    .filtros button i { width: 8px; height: 8px; border-radius: 50%; background: var(--cor, var(--text)); }
    .filtros button b { font-size: 12px; font-weight: 800; color: var(--text); opacity: .7; }
    .filtros button.on { color: var(--text); border-color: var(--cor, var(--text)); background: color-mix(in srgb, var(--cor, var(--text)) 12%, var(--panel)); }

    /* ---------- Akai Ito ---------- */
    .akai { position: relative; margin: 0 14px; padding: 18px 16px 16px; border-radius: 24px; overflow: hidden; color: #fff;
      background: radial-gradient(120% 90% at 50% 120%, rgba(255, 77, 109, .45), transparent 60%), linear-gradient(160deg, #2a0710, #12040a 70%); }
    .akai-tit { display: flex; align-items: center; justify-content: center; gap: 7px; margin: 0; font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #ff9aae; }
    .akai-tit svg { width: 15px; height: 15px; }
    .akai-par { position: relative; display: flex; align-items: center; justify-content: space-between; margin: 14px 6px 10px; }
    .akai-fio { position: absolute; left: 40px; right: 40px; top: 30px; height: 50px; overflow: visible; pointer-events: none; }
    .akai-fio path.linha { fill: none; stroke: #ff4d6d; stroke-width: 2.4; stroke-linecap: round; filter: drop-shadow(0 0 5px rgba(255, 77, 109, .9)); }
    .akai-fio path.brilho { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 18 400; animation: correr 3.2s linear infinite; opacity: .9; }
    @keyframes correr { from { stroke-dashoffset: 420; } to { stroke-dashoffset: 0; } }
    .akai-cor { position: absolute; left: 50%; top: 22px; width: 30px; height: 30px; transform: translateX(-50%); color: #ff4d6d; filter: drop-shadow(0 0 10px rgba(255, 77, 109, .9)); animation: bater 1.6s ease-in-out infinite; }
    @keyframes bater { 0%, 60%, 100% { transform: translateX(-50%) scale(1); } 20% { transform: translateX(-50%) scale(1.18); } }
    .akai-pessoa { position: relative; z-index: 2; display: grid; justify-items: center; gap: 6px; width: 96px; padding: 0; border: 0; background: none; color: #fff; cursor: pointer; }
    .akai-pessoa[disabled] { cursor: default; }
    .akai-pessoa .avatar { width: 56px; height: 56px; font-size: 18px; box-shadow: 0 0 0 2.5px #1a050b, 0 0 0 4.5px #ff4d6d, 0 10px 26px rgba(255, 77, 109, .35); }
    .akai-pessoa strong { max-width: 96px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .akai-pessoa em { margin-top: -4px; font-style: normal; font-size: 11.5px; color: #ff9aae; font-weight: 700; }
    .akai-desde { margin: 0; text-align: center; font-size: 12.5px; color: rgba(255, 255, 255, .7); }

    /* ---------- grupos em cartões-retrato ---------- */
    .grupos { display: grid; gap: 22px; }
    .grupo-cab { display: flex; align-items: baseline; gap: 8px; margin: 0 16px 10px; }
    .grupo-cab h3 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
    .grupo-cab small { color: var(--muted); font-size: 13px; font-weight: 600; }
    .grupo-cab i { align-self: center; width: 10px; height: 10px; border-radius: 50%; background: var(--cor); box-shadow: 0 0 8px var(--cor); }
    .trilho { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 4px; scroll-snap-type: x proximity; scroll-padding: 16px; scrollbar-width: none; }
    .trilho::-webkit-scrollbar { display: none; }
    .retrato { position: relative; flex: none; width: calc((100% - 24px) / 4); min-width: 0; max-width: 140px; display: grid; justify-items: center; align-content: start; gap: 4px; padding: 11px 4px 9px; border: 1px solid var(--line);
      border-radius: 18px; background: linear-gradient(180deg, color-mix(in srgb, var(--cor) 9%, var(--panel)), var(--panel) 70%); color: var(--text); cursor: pointer;
      scroll-snap-align: start; text-align: center; overflow: hidden; transition: transform .15s; }
    .retrato[disabled] { cursor: default; }
    .retrato::before { content: ""; position: absolute; left: 22%; right: 22%; top: 0; height: 2px; border-radius: 0 0 2px 2px; background: var(--cor); box-shadow: 0 0 10px var(--cor); }
    .retrato .avatar { width: 46px; height: 46px; font-size: 15px; box-shadow: 0 0 0 2.5px var(--panel), 0 0 0 4.5px var(--cor), 0 6px 16px color-mix(in srgb, var(--cor) 30%, transparent); }
    .retrato strong { max-width: 100%; margin-top: 3px; font-size: 12px; font-weight: 750; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .retrato small { max-width: 100%; padding: 1px 6px; border-radius: 999px; font-size: 9.5px; font-weight: 700; color: color-mix(in srgb, var(--cor) 80%, var(--text));
      background: color-mix(in srgb, var(--cor) 14%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .retrato.pend { opacity: .8; }
    .retrato.pend .avatar { box-shadow: 0 0 0 2.5px var(--panel), 0 0 0 4.5px color-mix(in srgb, var(--cor) 45%, transparent); filter: grayscale(.4); }
    .retrato.pend small { color: var(--muted); background: var(--panel-2); }
    .retrato.pend::before { background: repeating-linear-gradient(90deg, var(--cor) 0 5px, transparent 5px 9px); box-shadow: none; }
    @media (hover: hover) { .retrato:not([disabled]):hover { transform: translateY(-2px); } }
    .retrato:not([disabled]):active { transform: scale(.97); }
    .retrato.add { text-decoration: none; background: transparent; border-style: dashed; color: var(--muted); }
    .retrato.add::before { display: none; }
    .retrato.add span.mais { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; border: 1.5px dashed var(--cor); color: var(--cor); }
    .retrato.add strong { font-size: 12px; color: var(--text); }
    .retrato.add small { color: var(--muted); background: none; padding: 0; }
    .nota { margin: 0 16px; text-align: center; color: var(--muted); font-size: 13px; }

    /* ---------- painel do dono ---------- */
    .painel-dono { margin: 0 14px; padding: 16px; border-radius: 22px; background: var(--panel); border: 1px solid var(--line); display: grid; gap: 12px; }
    .painel-dono h3 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 15px; }
    .painel-dono p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .segmentado { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--panel-2); padding: 4px; border-radius: 12px; }
    .segmentado button { border: 0; background: transparent; border-radius: 9px; padding: 9px 4px; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; }
    .segmentado button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 4px rgba(0, 0, 0, .15); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 12px 18px; font-weight: 800; cursor: pointer; text-decoration: none; }
    .btn.pri { background: var(--accent); color: var(--accent-ink); }

    /* ---------- folhas ---------- */
    .folha-fundo { position: fixed; inset: 0; z-index: 2000; background: var(--overlay); display: grid; place-items: end center; }
    .folha { width: min(480px, 100%); max-height: 86vh; display: flex; flex-direction: column; background: var(--panel); border-radius: 22px 22px 0 0; overflow: hidden; }
    .folha-topo { display: flex; align-items: center; gap: 8px; padding: 12px 10px 12px 18px; border-bottom: 1px solid var(--line); }
    .folha-topo h3 { flex: 1; margin: 0; font-size: 16px; }
    .folha-corpo { overflow-y: auto; padding: 6px 0 calc(12px + env(safe-area-inset-bottom)); }
    .folha-corpo .grupo-t { padding: 12px 18px 4px; font-size: 12px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--cor, var(--muted)); }
    .linha { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 18px; border: 0; background: transparent; text-align: left; cursor: pointer; }
    @media (hover: hover) { .linha:hover { background: var(--hover); } }
    .linha[disabled] { cursor: default; }
    .linha .avatar { width: 40px; height: 40px; font-size: 13px; box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--cor, transparent); }
    .linha .tx { flex: 1; min-width: 0; }
    .linha .tx strong { display: block; font-size: 14.5px; }
    .linha .tx small { color: var(--muted); font-size: 12.5px; }
    .linha.perigo { color: var(--danger); }
    .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 3000; background: var(--text); color: var(--panel); padding: 12px 18px; border-radius: 12px; font-weight: 600; font-size: 14px; width: max-content; max-width: min(calc(100% - 32px), 440px); text-align: center; line-height: 1.35; text-wrap: balance; }
    @media (min-width: 700px) { .folha-fundo { place-items: center; } .folha { border-radius: 22px; } }
    @media (max-width: 380px) { .astro { width: 58px; } .astro .avatar { width: 34px; height: 34px; } .astro.duo .avatar { width: 40px; height: 40px; } .astro.centro .avatar { width: 62px; height: 62px; } .centro .halo { top: 31px; } }
    @media (prefers-reduced-motion: reduce) { .akai-cor, .akai-fio path.brilho { animation: none; } }
  </style>

  <script type="module">
    import { fotoSegura } from "./seguranca.js?v=1";
    import { confirmarHF } from "./confirmar.js?v=6";
    const $ = (id) => document.getElementById(id);
    // Duo inclui namorado(a) e cônjuge: é a pessoa ligada pelo Akai Ito.
    const TIPOS = {
      duo: ["Duo", "duo"], namoro: ["Namorado(a)", "duo"], casamento: ["Cônjuge", "duo"],
      melhor_amigo: ["Melhor amigo(a)", "amizade"], amigo: ["Amigo(a)", "amizade"],
      irmao: ["Irmão(ã)", "familia"], pai_mae: ["Pai/Mãe", "familia"], filho: ["Filho(a)", "familia"],
      primo: ["Primo(a)", "familia"], tio: ["Tio(a)", "familia"], sobrinho: ["Sobrinho(a)", "familia"],
      avo: ["Avô/Avó", "familia"], neto: ["Neto(a)", "familia"], parceiro: ["Colega de trabalho", "trabalho"]
    };
    // Vagas fixas no mapa: 1 para o amor (duo), 4 para amizades, 4 para colegas e 4 para família.
    // centro = ângulo do setor (270 = topo, 0 = direita, 90 = baixo, 180 = esquerda).
    const GRUPOS = [
      { cat: "duo", nome: "Amor", centro: 270, vagas: 1 },
      { cat: "amizade", nome: "Amizades", centro: 0, vagas: 4 },
      { cat: "trabalho", nome: "Colegas", centro: 90, vagas: 4 },
      { cat: "familia", nome: "Família", centro: 180, vagas: 4 }
    ];
    // posição de cada vaga: deslocamento em graus e distância do centro (fração do raio), em zigue-zague
    const VAGAS = { 1: [[0, 0.74]], 4: [[-34, 0.9], [-12, 0.6], [12, 0.9], [34, 0.6]] };
    const nomeGrupo = (cat) => GRUPOS.find((g) => g.cat === cat)?.nome || "";

    const urlSegura = (u) => fotoSegura(u);
    const iniciais = (n) => { const p = String(n || "?").trim().split(/\s+/); return ((p[0]?.[0] || "?") + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase(); };
    const primeiroNome = (n) => String(n || "Usuário").split(" ")[0];
    function pintarAvatar(el, foto, nome) {
      el.replaceChildren();
      const u = urlSegura(foto);
      if (u) { const i = document.createElement("img"); i.src = u; i.alt = ""; i.onerror = () => { el.textContent = iniciais(nome); }; el.appendChild(i); }
      else el.textContent = iniciais(nome);
    }
    function novoAvatar(foto, nome) { const d = document.createElement("div"); d.className = "avatar"; pintarAvatar(d, foto, nome); return d; }
    function icone(nome, classe = "i s") {
      const ns = "http://www.w3.org/2000/svg";
      const s = document.createElementNS(ns, "svg"); s.setAttribute("class", classe);
      const u = document.createElementNS(ns, "use"); u.setAttribute("href", "#i-" + nome); s.appendChild(u);
      return s;
    }
    const svgEl = (tag, attrs) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v)); return e; };
    const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
    function toast(t) { document.querySelectorAll(".toast").forEach((x) => x.remove()); const d = el("div", "toast", String(t ?? "").replace(/(R\$|\d)\s+(?=\S)/g, "$1\u00a0")); document.body.appendChild(d); setTimeout(() => d.remove(), 3500); }
    function estado(titulo, texto) { $("conteudo").hidden = true; $("estado").hidden = false; $("estado").replaceChildren(el("strong", null, titulo), texto || ""); }
    const irPerfil = (uid) => { location.href = `usuarios.html?perfil=${encodeURIComponent(uid)}`; };

    let fb, eu, dono, donoId, proprio = false, clicavel = false;
    let conexoes = [];
    let filtro = "todos";

    async function podeAbrirPerfis() {
      if (proprio) return true;
      const vis = dono.socialVisibilidade || "todos";
      if (vis === "todos") return true;
      if (vis === "ocultar") return false;
      const [euSigo, meSegue] = await Promise.all([
        fb.getDoc(fb.doc(fb.db, "relacoes", `${eu.uid}_${donoId}`)).then((s) => s.exists()).catch(() => false),
        fb.getDoc(fb.doc(fb.db, "relacoes", `${donoId}_${eu.uid}`)).then((s) => s.exists()).catch(() => false)
      ]);
      return vis === "seguidores" ? euSigo : euSigo && meSegue;
    }

    // ---------- folha (lista / opções) ----------
    function abrirFolha(titulo, montar) {
      const fundo = el("div", "folha-fundo");
      const f = el("div", "folha");
      f.setAttribute("role", "dialog");
      f.setAttribute("aria-modal", "true");
      const topo = el("div", "folha-topo");
      const fechar = el("button", "icone-btn");
      fechar.type = "button"; fechar.setAttribute("aria-label", "Fechar");
      fechar.appendChild(icone("fechar", "i"));
      topo.append(el("h3", null, titulo), fechar);
      const corpo = el("div", "folha-corpo");
      f.append(topo, corpo);
      fundo.appendChild(f);
      const sair = () => fundo.remove();
      fechar.addEventListener("click", sair);
      fundo.addEventListener("click", (e) => { if (e.target === fundo) sair(); });
      montar(corpo, sair);
      document.body.appendChild(fundo);
      fechar.focus();
    }

    function acaoPessoa(c) {
      if (proprio) {
        return () => abrirFolha(c.perfil.nome || "Usuário", (corpo, sair) => {
          const ver = el("button", "linha"); ver.type = "button";
          ver.append(icone("perfil", "i"), el("span", "tx", "Ver perfil"));
          ver.addEventListener("click", () => irPerfil(c.outro));
          const rm = el("button", "linha perigo"); rm.type = "button";
          rm.append(icone("lixo", "i"), el("span", "tx", c.pendente ? "Cancelar pedido" : "Desfazer vínculo"));
          rm.addEventListener("click", async () => {
            if (!c.pendente && !(await confirmarHF({ titulo: "Desfazer o vínculo?", texto: `Você e ${c.perfil.nome || "esta pessoa"} deixam de aparecer como vínculo no Social.`, ok: "Desfazer", icone: "lixo" }))) return;
            try { await fb.deleteDoc(fb.doc(fb.db, "vinculos", c.id)); conexoes = conexoes.filter((x) => x.id !== c.id); sair(); desenharTudo(); toast("Pronto"); }
            catch { toast("Não foi possível desfazer."); }
          });
          corpo.append(ver, rm);
        });
      }
      return clicavel ? () => irPerfil(c.outro) : null;
    }

    function listaDeNomes() {
      const aceitas = conexoes.filter((c) => !c.pendente);
      abrirFolha(`${aceitas.length} ${aceitas.length === 1 ? "conexão" : "conexões"}`, (corpo) => {
        if (!aceitas.length) { corpo.appendChild(el("p", "nota", "Nenhuma conexão ainda.")); return; }
        GRUPOS.forEach((g) => {
          const doGrupo = aceitas.filter((c) => c.cat === g.cat);
          if (!doGrupo.length) return;
          const t = el("div", "grupo-t", `${g.nome} · ${doGrupo.length}`);
          t.dataset.cat = g.cat;
          corpo.appendChild(t);
          doGrupo.forEach((c) => {
            const b = el("button", "linha"); b.type = "button"; b.dataset.cat = c.cat;
            const tx = el("span", "tx");
            tx.append(el("strong", null, c.perfil.nome || "Usuário"), el("small", null, TIPOS[c.tipo]?.[0] || ""));
            b.append(novoAvatar(c.perfil.fotoPerfil, c.perfil.nome), tx);
            if (clicavel) { b.addEventListener("click", () => irPerfil(c.outro)); b.appendChild(icone("avancar")); } else b.disabled = true;
            corpo.appendChild(b);
          });
        });
      });
    }


    function escolherFiltro(cat) {
      filtro = filtro === cat || cat === "todos" ? "todos" : cat;
      desenharFiltros(); desenharCeu(); desenharDuo(); desenharGrupos();
    }
    const aceitas = () => conexoes.filter((c) => !c.pendente);
    const ordemGrupo = (c) => GRUPOS.findIndex((g) => g.cat === c.cat);

    // ---------- o céu: a pessoa no centro e as conexões em órbita ----------
    function desenharCabecalho() {
      const capa = urlSegura(dono.fotoCapa) || urlSegura(dono.fotoPerfil);
      if (capa) $("ceuFundo").style.backgroundImage = `url(${JSON.stringify(capa)})`;
      $("heroNome").textContent = dono.nome || "Usuário";
      $("heroNick").textContent = dono.nickname ? "@" + dono.nickname : "";
      const n = aceitas().length;
      const t = $("ceuTotal"); t.replaceChildren(icone("teia"), el("b", null, String(n)), document.createTextNode(n === 1 ? " conexão" : " conexões"));
      t.onclick = listaDeNomes;
    }
    // Painel romântico (14/11, pedido dele): a pessoa no centro de um coração; as conexões pousam no contorno (o duo na
    // curvinha de cima, pelo fio vermelho) e cada uma fica ligada à pessoa por um fio fino na cor do grupo, com uma
    // gotinha de luz que corre de vez em quando. Nada gira: cada um flutua de leve no seu ritmo; o centro "bate" devagar.
    const giro = { planetas: [], quadro: 0, centro: null, estrelas: null, cx: 0, cy: 0 };
    // ponto do coração (u = 0 na curvinha de cima, volta toda em 2π); y para baixo
    const noCoracao = (u) => ({ x: 16 * Math.sin(u) ** 3, y: -(13 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u)) });
    function amostrasCoracao(esc, ox, oy) {
      const pts = []; let tot = 0;
      for (let k = 0; k <= 480; k++) {
        const q = noCoracao((k / 480) * Math.PI * 2), p = { x: ox + q.x * esc, y: oy + q.y * esc };
        if (pts.length) tot += Math.hypot(p.x - pts[pts.length - 1].x, p.y - pts[pts.length - 1].y);
        p.l = tot; pts.push(p);
      }
      return { pts, tot };
    }
    const pontoNa = (a, l) => { const pts = a.pts; let k = 1; while (k < pts.length - 1 && pts[k].l < l) k++; return pts[k]; };
    function desenharCeu() {
      const box = $("orbita"), svg = $("orbitaSvg");
      box.querySelectorAll(".astro, .ceu-vazio").forEach((x) => x.remove());
      svg.replaceChildren();
      giro.planetas = [];
      const W = box.clientWidth; if (!W) return;
      const lista = conexoes.filter((c) => proprio || !c.pendente).sort((a, b) => ordemGrupo(a) - ordemGrupo(b) || Number(a.pendente) - Number(b.pendente));
      const esc = Math.min(10.5, (W / 2 - 34) / 16);
      const H = Math.round(30 * esc + 70);
      box.style.height = H + "px";
      const ox = W / 2, oy = 13 * esc + 22;
      const cx = ox, cy = oy + 4.5 * esc;
      giro.cx = cx; giro.cy = cy;
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      const defs = svgEl("defs", {});
      const rg = svgEl("radialGradient", { id: "luzCoracao", cx: "50%", cy: "48%", r: "60%" });
      rg.append(svgEl("stop", { offset: "0%", "stop-color": "#ff4d6d", "stop-opacity": ".16" }), svgEl("stop", { offset: "100%", "stop-color": "#ff4d6d", "stop-opacity": "0" }));
      defs.appendChild(rg); svg.appendChild(defs);
      const fora = amostrasCoracao(esc, ox, oy);
      const d = "M " + fora.pts.map((p) => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" L ") + " Z";
      svg.append(svgEl("path", { class: "coracao-luz", d }), svgEl("path", { class: "coracao", d }));
      const raiz = getComputedStyle(document.documentElement);
      // lugares: o duo na curvinha de cima; os outros espalhados pelo contorno (e num coração menor, se não couberem)
      const duo = lista.find((c) => c.cat === "duo" && !c.pendente);
      const resto = lista.filter((c) => c !== duo);
      const lugares = [];
      if (duo) lugares.push({ c: duo, p: { x: ox, y: oy - 5 * esc - 4 } });
      const folga = duo ? 0.07 : 0.035, passo = 60;
      const cabe = Math.max(1, Math.floor((fora.tot * (1 - 2 * folga)) / passo) + 1);
      const dentro = amostrasCoracao(esc * 0.6, ox, oy + 1.5 * esc);
      const nFora = Math.min(resto.length, cabe), nDentro = resto.length - nFora;
      const espalhar = (a, n, f, de) => { for (let k = 0; k < n; k++) { const l = a.tot * (f + (1 - 2 * f) * (k + 0.5) / n); lugares.push({ c: resto[de + k], p: pontoNa(a, l) }); } };
      espalhar(fora, nFora, folga, 0);
      if (nDentro > 0) espalhar(dentro, Math.min(nDentro, 12), 0.12, nFora);
      lugares.forEach(({ c, p }, idx) => {
        const ap = filtro !== "todos" && filtro !== c.cat;
        const cor = c.cat === "duo" ? "#ff4d6d" : raiz.getPropertyValue(`--${c.cat}`).trim() || "#00adee";
        const extra = (ap ? " apagado" : "") + (c.pendente ? " pend" : "");
        const fio = svgEl("path", { class: "fio" + (c === duo ? " duo" : "") + extra, stroke: cor });
        const gota = svgEl("circle", { class: "gota" + extra, r: c === duo ? "2.4" : "1.8", fill: cor });
        svg.append(fio, gota);
        const b = el("button", "astro" + (c === duo ? " duo" : "") + (c.pendente ? " pend" : "") + (ap ? " apagado" : ""));
        b.type = "button"; b.dataset.cat = c.cat;
        b.append(novoAvatar(c.perfil.fotoPerfil, c.perfil.nome), el("span", null, primeiroNome(c.perfil.nome)));
        b.title = `${c.perfil.nome || "Usuário"} · ${TIPOS[c.tipo]?.[0] || ""}${c.pendente ? " (pendente)" : ""}`;
        const f = acaoPessoa(c); if (f) b.addEventListener("click", f); else b.disabled = true;
        box.appendChild(b);
        // a curva do fio vai para o lado de fora (como um fio de seda caindo)
        const lado = p.x >= cx ? 1 : -1;
        giro.planetas.push({ b, fio, gota, x: p.x, y: p.y, fase: idx * 1.7, lado, atraso: (idx * 0.73) % 4 });
      });
      const centro = el("div", "astro centro");
      centro.style.transform = `translate3d(${cx}px, ${cy}px, 0) translate(-50%, -35px)`;
      centro.append(el("i", "halo"), novoAvatar(dono.fotoPerfil, dono.nome));
      box.appendChild(centro); giro.centro = centro;
      if (!lista.length) box.appendChild(el("p", "ceu-vazio", proprio ? "Seu coração ainda está vazio: adicione quem é importante para você." : "Ainda sem conexões por aqui."));
      prepararEstrelas();
      posicionar(performance.now());
      if (!giro.quadro) giro.quadro = requestAnimationFrame(girar);
    }
    // estrelas piscando no fundo e, de vez em quando, um coraçãozinho que sobe devagar
    function prepararEstrelas() {
      const cv = $("ceuEstrelas"), ceu = cv.parentElement;
      const w = ceu.clientWidth, h = ceu.clientHeight, dpr = Math.min(2, devicePixelRatio || 1);
      if (!w || !h) return;
      cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + "px"; cv.style.height = h + "px";
      let semente = 7; const rnd = () => ((semente = (semente * 16807) % 2147483647) / 2147483647);
      const lista = Array.from({ length: Math.round((w * h) / 2600) }, () => ({ x: rnd() * w, y: rnd() * h, r: rnd() < 0.85 ? 0.4 + rnd() * 0.7 : 1.1 + rnd() * 0.8,
        f: 0.6 + rnd() * 1.8, o: rnd() * 6.3, cor: rnd() < 0.18 ? "255,190,205" : rnd() < 0.1 ? "255,224,170" : "255,255,255" }));
      giro.estrelas = { cv, ctx: cv.getContext("2d"), w, h, dpr, lista, subindo: [], proxima: performance.now() + 1200 };
    }
    function coracaozinho(ctx, x, y, r) {
      ctx.beginPath(); ctx.moveTo(x, y + r * 0.35);
      ctx.bezierCurveTo(x, y - r * 0.3, x - r, y - r * 0.3, x - r, y + r * 0.25);
      ctx.bezierCurveTo(x - r, y + r * 0.75, x - r * 0.2, y + r * 1.05, x, y + r * 1.4);
      ctx.bezierCurveTo(x + r * 0.2, y + r * 1.05, x + r, y + r * 0.75, x + r, y + r * 0.25);
      ctx.bezierCurveTo(x + r, y - r * 0.3, x, y - r * 0.3, x, y + r * 0.35); ctx.fill();
    }
    function pintarEstrelas(t) {
      const e = giro.estrelas; if (!e) return;
      const { ctx, w, h, dpr } = e;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      const s = t / 1000;
      for (const p of e.lista) {
        const a = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(s * p.f + p.o));
        ctx.fillStyle = `rgba(${p.cor},${a.toFixed(3)})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      }
      if (e.subindo.length < 5 && t > e.proxima) { e.subindo.push({ x: w * (0.06 + Math.random() * 0.88), t0: t, d: 9000 + Math.random() * 5000, r: 3 + Math.random() * 3, o: Math.random() * 6 }); e.proxima = t + 1800 + Math.random() * 2600; }
      e.subindo = e.subindo.filter((c) => {
        const k = (t - c.t0) / c.d; if (k >= 1) return false;
        const y = h + 10 - k * (h + 30), x = c.x + Math.sin(k * 6 + c.o) * 8;
        ctx.fillStyle = `rgba(255,110,140,${(Math.sin(k * Math.PI) * 0.32).toFixed(3)})`;
        coracaozinho(ctx, x, y, c.r);
        return true;
      });
    }
    function posicionar(t) {
      const s = t / 1000, cx = giro.cx, cy = giro.cy;
      for (const p of giro.planetas) {
        const x = p.x + Math.sin(s * 0.7 + p.fase) * 2, y = p.y + Math.sin(s * 0.9 + p.fase * 1.3) * 3.2;
        p.b.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) translate(-50%, -22px)`;
        const mx = (cx + x) / 2, my = (cy + y) / 2, dx = x - cx, dy = y - cy, len = Math.hypot(dx, dy) || 1;
        const qx = mx + (-dy / len) * len * 0.12 * p.lado, qy = my + (dx / len) * len * 0.12 * p.lado + len * 0.05;
        p.fio.setAttribute("d", `M ${cx.toFixed(1)} ${cy.toFixed(1)} Q ${qx.toFixed(1)} ${qy.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}`);
        // gotinha de luz: corre do centro até a pessoa em 1,6 s, a cada 4 s
        const k = ((s + p.atraso) % 4) / 1.6;
        if (k <= 1) {
          const a = 1 - k, gx = a * a * cx + 2 * a * k * qx + k * k * x, gy = a * a * cy + 2 * a * k * qy + k * k * y;
          p.gota.setAttribute("cx", gx.toFixed(1)); p.gota.setAttribute("cy", gy.toFixed(1)); p.gota.style.display = "";
          p.gota.style.opacity = (Math.sin(k * Math.PI) * 0.95).toFixed(2);
        } else p.gota.style.display = "none";
      }
      if (giro.centro) {
        // batida: duas pulsadas curtas a cada 1,8 s
        const f = (s % 1.8) / 1.8, bate = Math.exp(-((f - 0.06) ** 2) / 0.0012) + 0.6 * Math.exp(-((f - 0.2) ** 2) / 0.0012);
        const halo = giro.centro.querySelector(".halo");
        if (halo) { halo.style.transform = `translate(-50%, -50%) scale(${(1 + bate * 0.12).toFixed(3)})`; halo.style.opacity = (0.75 + bate * 0.25).toFixed(2); }
      }
    }
    function girar(t) {
      if (!document.body.contains($("orbita"))) { giro.quadro = 0; return; }
      if (!document.querySelector(".folha-fundo")) posicionar(t);
      pintarEstrelas(t);
      giro.quadro = requestAnimationFrame(girar);
    }

    // ---------- filtros com contagem ----------
    function desenharFiltros() {
      const box = $("filtros"); box.replaceChildren();
      const chip = (cat, nome, n) => {
        const b = el("button", filtro === cat ? "on" : ""); b.type = "button";
        if (cat !== "todos") { b.dataset.cat = cat; b.appendChild(el("i")); }
        b.append(document.createTextNode(nome), el("b", null, String(n)));
        b.setAttribute("aria-pressed", String(filtro === cat));
        b.addEventListener("click", () => escolherFiltro(cat));
        box.appendChild(b);
      };
      chip("todos", "Todos", aceitas().length);
      GRUPOS.forEach((g) => chip(g.cat, g.nome, aceitas().filter((c) => c.cat === g.cat).length));
    }

    // ---------- Akai Ito ----------
    function desenharDuo() {
      const box = $("duo");
      const c = conexoes.find((x) => x.cat === "duo" && !x.pendente);
      box.hidden = !c || (filtro !== "todos" && filtro !== "duo");
      if (!c) return;
      box.replaceChildren();
      const tit = el("p", "akai-tit"); tit.append(icone("rosa"), document.createTextNode(c.tipo === "duo" ? "Duo · Akai Ito" : `${TIPOS[c.tipo][0]} · Akai Ito`));
      const par = el("div", "akai-par");
      const fio = svgEl("svg", { class: "akai-fio", viewBox: "0 0 200 50", preserveAspectRatio: "none" });
      fio.append(svgEl("path", { class: "linha", d: "M0 30 C40 2 70 46 100 22 C130 46 160 2 200 30" }), svgEl("path", { class: "brilho", d: "M0 30 C40 2 70 46 100 22 C130 46 160 2 200 30" }));
      const cor = svgEl("svg", { class: "akai-cor", viewBox: "0 0 24 24" }); cor.appendChild(svgEl("path", { d: "M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.6.7-1.4 2.2-2.6 4.3-2.6 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z", fill: "currentColor" }));
      const pessoa = (perfil, uid, papel) => {
        const b = el("button", "akai-pessoa"); b.type = "button";
        b.append(novoAvatar(perfil.fotoPerfil, perfil.nome), el("strong", null, primeiroNome(perfil.nome)));
        if (papel) b.appendChild(el("em", null, papel));
        if (uid === donoId) b.disabled = true;
        else { const f = acaoPessoa(c); if (f) b.addEventListener("click", f); else b.disabled = true; }
        return b;
      };
      par.append(fio, cor, pessoa(dono, donoId, ""), pessoa(c.perfil, c.outro, c.tipo === "duo" ? "" : TIPOS[c.tipo][0]));
      const desde = c.aceitoEm?.toDate?.();
      box.append(tit, par, el("p", "akai-desde", desde ? `Ligados pelo fio vermelho desde ${desde.toLocaleDateString("pt-BR", { month: "long", year: "numeric" })}` : "Ligados pelo fio vermelho"));
    }

    // ---------- grupos: cartões-retrato ----------
    function desenharGrupos() {
      const box = $("grupos"); box.replaceChildren();
      GRUPOS.forEach((g) => {
        if (filtro !== "todos" && filtro !== g.cat) return;
        const lista = conexoes.filter((c) => c.cat === g.cat && (proprio || !c.pendente))
          .sort((a, b) => Number(a.pendente) - Number(b.pendente) || String(a.perfil.nome).localeCompare(String(b.perfil.nome)));
        const vagas = g.vagas - lista.filter((c) => !c.pendente).length;
        if (!lista.length && !(proprio && filtro === g.cat)) return;
        const sec = el("div", "grupo"); sec.dataset.cat = g.cat;
        const cab = el("div", "grupo-cab"); cab.append(el("i"), el("h3", null, g.nome), el("small", null, `${lista.filter((c) => !c.pendente).length} de ${g.vagas}`));
        const tr = el("div", "trilho");
        lista.forEach((c) => {
          const b = el("button", "retrato" + (c.pendente ? " pend" : "")); b.type = "button"; b.dataset.cat = c.cat;
          b.append(novoAvatar(c.perfil.fotoPerfil, c.perfil.nome), el("strong", null, primeiroNome(c.perfil.nome) || "Usuário"),
            el("small", null, c.pendente ? (c.de === eu.uid ? "Aguardando" : "Pedido recebido") : (TIPOS[c.tipo]?.[0] || "")));
          b.title = c.perfil.nome || "Usuário";
          const f = acaoPessoa(c); if (f) b.addEventListener("click", f); else b.disabled = true;
          tr.appendChild(b);
        });
        if (proprio && vagas > 0) {
          const a = el("a", "retrato add"); a.href = "usuarios.html?acao=social"; a.dataset.cat = g.cat;
          const m = el("span", "mais"); m.appendChild(icone("mais", "i"));
          a.append(m, el("strong", null, "Adicionar"), el("small", null, `${vagas} ${vagas === 1 ? "vaga" : "vagas"}`));
          tr.appendChild(a);
        }
        sec.append(cab, tr);
        box.appendChild(sec);
      });
    }

    function desenharTudo() {
      desenharCabecalho(); desenharFiltros(); desenharCeu(); desenharDuo(); desenharGrupos();
    }

    async function iniciar() {
      for (let i = 0; i < 100 && (!window.firebaseAuth || !window.firebaseDb); i++) await new Promise((r) => setTimeout(r, 50));
      if (!window.firebaseAuth) { estado("Não foi possível conectar", "Abra esta página pelo site."); return; }
      const [auth, firestore] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")
      ]);
      fb = { ...firestore, db: window.firebaseDb };
      auth.onAuthStateChanged(window.firebaseAuth, async (u) => {
        if (!u) { if (window.__hfIrLogin) window.__hfIrLogin(); else location.href = "login.html"; return; }
        if (eu) return;
        eu = u;
        donoId = new URLSearchParams(location.search).get("uid") || eu.uid;
        proprio = donoId === eu.uid;
        if (!proprio) $("btnVoltar").href = `usuarios.html?perfil=${encodeURIComponent(donoId)}`;
        try {
          if (!proprio) {
            const [b1, b2] = await Promise.all([
              fb.getDoc(fb.doc(fb.db, "bloqueios", `${donoId}_${eu.uid}`)).then((s) => s.exists()).catch(() => false),
              fb.getDoc(fb.doc(fb.db, "bloqueios", `${eu.uid}_${donoId}`)).then((s) => s.exists()).catch(() => false)
            ]);
            if (b1 || b2) { estado("Social indisponível", "Não é possível ver este social."); return; }
          }
          const s = await fb.getDoc(fb.doc(fb.db, "perfis_publicos", donoId));
          dono = s.exists() ? s.data() : {};
          $("titulo").textContent = proprio ? "Meu social" : `Social de ${primeiroNome(dono.nome)}`;
          $("tituloSub").textContent = dono.nickname ? "@" + dono.nickname : "";
          $("btnAdd").hidden = !proprio; $("btnAddEspaco").hidden = proprio;
          document.title = `${$("titulo").textContent} | Help Floripa`;
          if (!proprio && (dono.socialVisibilidade || "todos") === "ocultar") { estado("Social privado", "Esta pessoa preferiu não mostrar o social."); return; }
          clicavel = await podeAbrirPerfis();
          // Social de outra pessoa: só vínculos aceitos (pedidos pendentes são privados pelas regras).
          const filtros = [fb.where("participantes", "array-contains", donoId)];
          if (!proprio) filtros.push(fb.where("status", "==", "aceito"));
          const snap = await fb.getDocs(fb.query(fb.collection(fb.db, "vinculos"), ...filtros, fb.limit(60)));
          const brutos = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          const perfis = await Promise.all(brutos.map((v) => {
            const outro = (v.participantes || []).find((x) => x !== donoId);
            return fb.getDoc(fb.doc(fb.db, "perfis_publicos", outro)).then((p) => (p.exists() ? p.data() : {})).catch(() => ({}));
          }));
          conexoes = brutos.map((v, i) => {
            const outro = (v.participantes || []).find((x) => x !== donoId);
            const tipo = donoId === v.de ? v.tipoDe : v.tipoPara;
            return { id: v.id, de: v.de, outro, tipo, cat: TIPOS[tipo]?.[1] || "amizade", pendente: v.status !== "aceito", perfil: perfis[i], aceitoEm: v.aceitoEm };
          }).filter((c) => proprio || !c.pendente);

          $("estado").hidden = true;
          $("conteudo").hidden = false;
          if (!proprio && !clicavel) {
            $("nota").hidden = false;
            $("nota").textContent = dono.socialVisibilidade === "amigos" ? "Os perfis abrem só para amigos (quem segue e é seguido)." : "Os perfis abrem só para seguidores.";
          }
          if (proprio) {
            $("donoBox").hidden = false;
            const pintar = () => document.querySelectorAll("#visibilidade [data-valor]").forEach((b) => b.classList.toggle("on", b.dataset.valor === (dono.socialVisibilidade || "todos")));
            pintar();
            $("visibilidade").addEventListener("click", async (e) => {
              const b = e.target.closest("[data-valor]");
              if (!b) return;
              const antes = dono.socialVisibilidade;
              dono.socialVisibilidade = b.dataset.valor;
              pintar();
              try { await fb.setDoc(fb.doc(fb.db, "perfis_publicos", eu.uid), { uid: eu.uid, socialVisibilidade: b.dataset.valor }, { merge: true }); toast("Privacidade atualizada"); }
              catch { dono.socialVisibilidade = antes; pintar(); toast("Não foi possível salvar."); }
            });
          }
          desenharTudo();
          let t = null;
          let largura = $("orbita").clientWidth;
          new ResizeObserver(() => { const w = $("orbita").clientWidth; if (w === largura) return; largura = w; clearTimeout(t); t = setTimeout(desenharCeu, 100); }).observe($("orbita"));
        } catch (e) {
          console.error(e);
          estado("Não foi possível carregar", "Tente novamente em instantes.");
        }
      });
    }
    iniciar();
  </script>
</body>
