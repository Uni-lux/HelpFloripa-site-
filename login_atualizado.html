<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Help Floripa</title>
  <style>
    :root {
      --hf-blue: #00adee;
      --hf-blue-dark: #0087c2;
      --hf-bg: #000;
      --hf-surface: #111;
      --hf-text: #f1f1f1;
      --hf-muted: #b9c2c8;
      --hf-border: #00adee66;
    }

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #0b1b24 0%, var(--hf-bg) 38%);
      color: var(--hf-text);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .login-shell {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, #151515 0%, #0d0d0d 100%);
      border: 1px solid var(--hf-border);
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
      padding: 28px 22px;
    }

    .brand {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
      color: var(--hf-blue);
    }

    .brand p {
      margin: 8px 0 0;
      font-size: 14px;
      color: var(--hf-muted);
    }

    .notice {
      min-height: 18px;
      color: var(--hf-blue);
      text-align: center;
      margin: 0 0 12px;
      font-size: 13px;
    }

    .error {
      min-height: 18px;
      color: #ff6b6b;
      text-align: center;
      margin: 0 0 12px;
      font-size: 14px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #d5dde2;
    }

    .field input {
      width: 100%;
      border: 1px solid #2f3b42;
      border-radius: 10px;
      background: #0a0a0a;
      color: var(--hf-text);
      padding: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      border-color: var(--hf-blue);
      box-shadow: 0 0 0 3px rgba(0, 173, 238, 0.2);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 72px;
    }

    .toggle-password {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      padding: 0;
      margin: 0;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #d9e0e5;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-password:hover {
      background: transparent;
    }

    .toggle-password:hover svg path,
    .toggle-password:hover svg circle {
      stroke: var(--hf-blue);
    }

    .toggle-password svg {
      width: 22px;
      height: 22px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px;
      background: var(--hf-blue);
      color: #000;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 4px;
    }

    button:hover {
      background: var(--hf-blue-dark);
    }

    button:active {
      transform: translateY(1px);
    }

    .links {
      text-align: center;
      margin-top: 14px;
      font-size: 14px;
      color: var(--hf-muted);
    }

    .links a {
      color: var(--hf-blue);
      text-decoration: none;
      font-weight: 700;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .back-home {
      display: inline-block;
      margin-top: 12px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <header class="brand">
      <h1>Help Floripa</h1>
      <p>Entre para acessar seu perfil e serviços</p>
    </header>

    <p id="noticeMsg" class="notice"></p>
    <p id="errorMsg" class="error"></p>

    <form id="loginForm">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Seu e-mail" required />
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="Sua senha" required />
          <button type="button" id="togglePassword" class="toggle-password" aria-label="Mostrar senha" aria-pressed="false">
            <svg class="icone-olho-aberto" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 12C2 12 5.5 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 18.5 18.5 12 18.5C5.5 18.5 2 12 2 12Z" stroke="#8a9aa5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" stroke="#8a9aa5" stroke-width="1.8"/>
            </svg>
            <svg class="icone-olho-fechado" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none;">
              <path d="M3 3L21 21" stroke="#8a9aa5" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M10.6 5.6C11 5.55 11.5 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 21.1 13.7 19.3 15.4M6.6 6.6C4 8.2 2 12 2 12C2 12 5.5 18.5 12 18.5C13.6 18.5 15 18.1 16.2 17.5" stroke="#8a9aa5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M9.9 10.1A3 3 0 0012 15a3 3 0 002.1-0.9" stroke="#8a9aa5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit">Entrar</button>
    </form>

    <div class="links">
      <p><a id="resetPassword" href="#">Esqueci minha senha</a></p>
      <p>Não tem conta? <a href="cadastre-se.html">Cadastre-se agora</a></p>
      <a class="back-home" href="index.html">← Voltar para Home</a>
    </div>
  </main>

  <script type="module">
    import { auth } from "./firebase.js";
    import {
      signInWithEmailAndPassword,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const form = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");
    const noticeMsg = document.getElementById("noticeMsg");
    const passwordInput = document.getElementById("password");
    const togglePasswordBtn = document.getElementById("togglePassword");

    // Só aceitamos redirecionar para páginas locais conhecidas (nome de
    // arquivo .html simples, sem barras nem protocolo). Isso evita que o
    // parâmetro ?redirect= vire uma brecha de "open redirect" para sites
    // externos.
    const ALLOWED_REDIRECT_PAGES = [
      "servicos.html",
      "delivery.html",
      "shopping.html",
      "imoveis.html"
    ];

    function getSafeRedirectTarget() {
      const params = new URLSearchParams(window.location.search);
      const requested = params.get("redirect");
      if (requested && ALLOWED_REDIRECT_PAGES.includes(requested)) {
        return requested;
      }
      return "index.html";
    }

    const redirectTarget = getSafeRedirectTarget();
    if (redirectTarget !== "index.html") {
      noticeMsg.textContent = "Faça login para continuar.";
    }

    function getFirebaseLoginErrorMessage(errorCode) {
      switch (errorCode) {
        case "auth/invalid-credential":
        case "auth/wrong-password":
        case "auth/user-not-found":
          return "E-mail ou senha incorretos.";
        case "auth/invalid-email":
          return "Digite um e-mail válido.";
        case "auth/too-many-requests":
          return "Muitas tentativas. Tente novamente em alguns minutos.";
        case "auth/network-request-failed":
          return "Sem conexão com a internet. Verifique e tente novamente.";
        case "auth/operation-not-allowed":
          return "Login por e-mail/senha não está habilitado no Firebase Auth.";
        default:
          return "Não foi possível fazer login agora. Tente novamente.";
      }
    }

    togglePasswordBtn.addEventListener("click", () => {
      const olhoAberto =
        togglePasswordBtn.querySelector(".icone-olho-aberto");

      const olhoFechado =
        togglePasswordBtn.querySelector(".icone-olho-fechado");

      const mostrando = passwordInput.type === "text";

      passwordInput.type = mostrando ? "password" : "text";

      olhoAberto.style.display = mostrando ? "block" : "none";
      olhoFechado.style.display = mostrando ? "none" : "block";

      togglePasswordBtn.setAttribute(
        "aria-pressed",
        String(!mostrando)
      );

      togglePasswordBtn.setAttribute(
        "aria-label",
        mostrando ? "Mostrar senha" : "Ocultar senha"
      );
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = redirectTarget;
      } catch (error) {
        console.error("[Login] Erro ao entrar:", error);
        errorMsg.textContent = getFirebaseLoginErrorMessage(error.code);
      }
    });

    document.getElementById("resetPassword").addEventListener("click", async (e) => {
      e.preventDefault();
      errorMsg.textContent = "";

      const email = document.getElementById("email").value.trim();
      if (!email) {
        errorMsg.textContent = "Digite seu e-mail para redefinir a senha.";
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        alert("E-mail de redefinição enviado!");
      } catch (error) {
        console.error("[Login] Erro ao redefinir senha:", error);
        errorMsg.textContent = "Erro ao enviar redefinição.";
      }
    });
  </script>
</body>
</html>
