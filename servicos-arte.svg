<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <!-- Arte do topo de Freelances (no lugar da foto): azul escuro vivo, ferramentas em linha, casa, pins e conexões. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030a26"/>
      <stop offset=".45" stop-color="#0731a3"/>
      <stop offset="1" stop-color="#0b5cff"/>
    </linearGradient>
    <radialGradient id="brilho" cx=".78" cy=".35" r=".55">
      <stop offset="0" stop-color="#3fa9ff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#1d6bff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#1d6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilho2" cx=".1" cy="1" r=".6">
      <stop offset="0" stop-color="#00adee" stop-opacity=".35"/>
      <stop offset="1" stop-color="#00adee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="traco" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe3ff"/>
      <stop offset="1" stop-color="#4f8dff"/>
    </linearGradient>
    <pattern id="pontos" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#9fd4ff" opacity=".18"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#fundo)"/>
  <rect width="1200" height="800" fill="url(#pontos)"/>
  <rect width="1200" height="800" fill="url(#brilho)"/>
  <rect width="1200" height="800" fill="url(#brilho2)"/>

  <!-- anéis -->
  <g fill="none" stroke="#7cc4ff" stroke-opacity=".16">
    <circle cx="930" cy="280" r="170" stroke-width="2"/>
    <circle cx="930" cy="280" r="250" stroke-width="1.5"/>
    <circle cx="930" cy="280" r="340" stroke-width="1"/>
  </g>

  <!-- casa no centro dos anéis -->
  <g fill="none" stroke="url(#traco)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M840 300 L930 225 L1020 300"/>
    <path d="M858 287 V378 H1002 V287"/>
    <path d="M908 378 V330 H952 V378"/>
    <path d="M985 250 V222 H1003 V265"/>
  </g>
  <circle cx="930" cy="280" r="128" fill="#ffffff" fill-opacity=".04"/>

  <!-- conexões tracejadas entre os serviços -->
  <g fill="none" stroke="#9fe3ff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round">
    <path d="M930 280 Q 780 140 700 120"/>
    <path d="M930 280 Q 1080 120 1120 110"/>
    <path d="M930 280 Q 1110 380 1130 470"/>
    <path d="M930 280 Q 820 470 760 520"/>
    <path d="M930 280 Q 960 520 980 600"/>
  </g>

  <!-- chave inglesa -->
  <g transform="translate(700 120) rotate(-30)">
    <circle r="44" fill="#0b2a80" fill-opacity=".55" stroke="#7cc4ff" stroke-opacity=".35" stroke-width="2"/>
    <path transform="rotate(30) translate(-24 -24) scale(2)" d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" fill="none" stroke="url(#traco)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- rolo de pintura -->
  <g transform="translate(1120 110)">
    <circle r="44" fill="#0b2a80" fill-opacity=".55" stroke="#7cc4ff" stroke-opacity=".35" stroke-width="2"/>
    <g fill="none" stroke="url(#traco)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-20" y="-20" width="34" height="14" rx="4"/>
      <path d="M14 -13 H20 V0 H-2 V8"/>
      <path d="M-2 8 V22"/>
    </g>
  </g>
  <!-- vassoura (limpeza) -->
  <g transform="translate(1130 470)">
    <circle r="44" fill="#0b2a80" fill-opacity=".55" stroke="#7cc4ff" stroke-opacity=".35" stroke-width="2"/>
    <g fill="none" stroke="url(#traco)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 -24 L-2 4"/>
      <path d="M-14 0 H10 L14 20 H-18 Z"/>
      <path d="M-8 8 V20 M2 8 V20"/>
    </g>
  </g>
  <!-- tesoura (beleza) -->
  <g transform="translate(760 520)">
    <circle r="44" fill="#0b2a80" fill-opacity=".55" stroke="#7cc4ff" stroke-opacity=".35" stroke-width="2"/>
    <g fill="none" stroke="url(#traco)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-10" cy="14" r="7"/><circle cx="10" cy="14" r="7"/>
      <path d="M-6 8 L12 -22 M6 8 L-12 -22"/>
    </g>
  </g>
  <!-- notebook (tecnologia) -->
  <g transform="translate(980 600)">
    <circle r="44" fill="#0b2a80" fill-opacity=".55" stroke="#7cc4ff" stroke-opacity=".35" stroke-width="2"/>
    <g fill="none" stroke="url(#traco)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path transform="translate(-24 -24) scale(2)" stroke-width="2.4" d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/>
    </g>
  </g>

  <!-- pins de localização -->
  <g fill="#00adee">
    <path d="M590 640 c0 -22 18 -38 38 -38 s38 16 38 38 c0 28 -38 62 -38 62 s-38 -34 -38 -62z" fill-opacity=".9"/>
    <circle cx="628" cy="640" r="13" fill="#03123d"/>
  </g>
  <g fill="#5ec8ff" fill-opacity=".55">
    <path d="M1080 700 c0 -13 10 -22 22 -22 s22 9 22 22 c0 16 -22 36 -22 36 s-22 -20 -22 -36z"/>
    <path d="M520 260 c0 -10 8 -18 18 -18 s18 8 18 18 c0 13 -18 29 -18 29 s-18 -16 -18 -29z"/>
  </g>

  <!-- estrelas e brilhos -->
  <g fill="#ffd166">
    <path d="M820 470 l7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2z" fill-opacity=".95"/>
    <path d="M1060 330 l5 10 11 1.5 -8 7.5 2 11 -10 -5.5 -10 5.5 2 -11 -8 -7.5 11 -1.5z" fill-opacity=".8"/>
  </g>
  <g fill="#ffffff">
    <circle cx="640" cy="200" r="3" fill-opacity=".7"/>
    <circle cx="1170" cy="300" r="2.5" fill-opacity=".6"/>
    <circle cx="860" cy="660" r="2.5" fill-opacity=".6"/>
    <circle cx="560" cy="420" r="2" fill-opacity=".5"/>
    <path d="M1040 520 v14 M1033 527 h14" stroke="#ffffff" stroke-opacity=".7" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M600 110 v12 M594 116 h12" stroke="#ffffff" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
