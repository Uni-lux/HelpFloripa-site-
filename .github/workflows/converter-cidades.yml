# Converte de uma vez as cidades antigas ("Florianópolis", "Florianópolis/SC") para estado +
# cidade do IBGE em contas, perfis, negócios e anúncios. Roda só quando alguém manda
# (Actions > Converter cidades > Run workflow). Por padrão só simula e mostra o que mudaria.
# Precisa do segredo FIREBASE_SERVICE_ACCOUNT (o mesmo das tarefas diárias).
name: Converter cidades (endereço para o Brasil todo)
on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Gravar a conversão? (desmarcado = só simular)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  converter:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    defaults:
      run:
        working-directory: scripts/limpeza
    steps:
      - name: Sem segredo configurado
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT == '' }}
        working-directory: .
        run: echo "::error::Configure o segredo FIREBASE_SERVICE_ACCOUNT." && exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar
        run: npm install --no-audit --no-fund
      - name: Converter
        run: node converter-cidades.mjs ${{ inputs.aplicar && '--aplicar' || '' }}
