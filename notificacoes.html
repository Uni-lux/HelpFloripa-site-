  <script>
    // Tema claro/escuro: o mesmo do perfil, das mensagens e do menu.
    (function () {
      var c = {};
      try { c = JSON.parse(localStorage.getItem("hf-chat-config") || "{}"); } catch (e) {}
      var tema = c.tema || "sistema";
      var escuro = tema === "escuro" || (tema === "sistema" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = escuro ? "dark" : "light";
    })();
  </script>
  <link rel="stylesheet" href="rede.css?v=2" />
  <script type="module" src="firebase.js"></script>
  <script type="module" src="notificacoes.js?v=3"></script>

<body>
  <header class="topo">
    <a href="index.html" class="icone-btn" aria-label="Início do Help Floripa" title="Início"><svg class="i"><use href="#i-casa"/></svg></a>
    <span class="topo-espaco" aria-hidden="true"></span>
    <a href="index.html" class="marca" aria-label="Help Floripa - Início"><strong>HELP <span>FLORIPA</span></strong><small>TUDO EM UM SÓ LUGAR</small></a>
    <a href="notificacoes.html" class="icone-btn" aria-label="Notificações" title="Notificações"><svg class="i"><use href="#i-sino"/></svg><b class="ponto-badge" id="badgeAvisos" hidden></b></a>
    <a href="configuracoes.html" class="icone-btn" aria-label="Configurações" title="Configurações"><svg class="i"><use href="#i-config"/></svg></a>
  </header>

  <main class="pagina">
    <div class="cab-pagina"><div><h1>Notificações</h1><p>Seguidores, estrelas, comentários, pedidos do social, mensagens e reclamações.</p></div></div>
    <div class="aviso-notif" id="avisoNavegador" hidden>
      <span>Receba avisos de mensagens, seguidores, estrelas, comentários e reclamações mesmo com a aba em segundo plano.</span>
      <button type="button" class="btn pri mini" id="ativarNotif">Ativar</button>
    </div>
    <div class="abas-rede" id="abasAvisos" role="tablist" aria-label="Filtrar notificações">
      <button type="button" role="tab" data-filtro="tudo" aria-selected="true">Tudo <em></em></button>
      <button type="button" role="tab" data-filtro="seguidor" aria-selected="false">Seguidores <em></em></button>
      <button type="button" role="tab" data-filtro="curtida" aria-selected="false">Estrelas <em></em></button>
      <button type="button" role="tab" data-filtro="comentario" aria-selected="false">Comentários <em></em></button>
      <button type="button" role="tab" data-filtro="social" aria-selected="false">Social <em></em></button>
      <button type="button" role="tab" data-filtro="mensagem" aria-selected="false">Mensagens <em></em></button>
      <button type="button" role="tab" data-filtro="reclamacao" aria-selected="false">Reclamações <em></em></button>
    </div>
    <div class="cartao" style="padding:6px" id="listaAvisos" aria-live="polite"><div class="lista-vazia">Carregando...</div></div>
  </main>
</body>
</html>
