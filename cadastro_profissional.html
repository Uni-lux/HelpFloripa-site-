<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastre-se como profissional | Help Floripa</title>
  <meta name="description" content="Crie sua conta de profissional na Help Floripa.">

  <style>
    :root {
      --hf-blue: #00adee;
      --hf-blue-dark: #0087c2;
      --hf-bg: #000;
      --hf-surface: #111;
      --hf-text: #f1f1f1;
      --hf-muted: #b9c2c8;
      --hf-border: #00adee66;
    }

    * { box-sizing: border-box; font-family: Arial, sans-serif; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #0b1b24 0%, var(--hf-bg) 38%);
      color: var(--hf-text);
      padding: 32px 16px 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cadastro-shell {
      width: min(440px, 100%);
      margin: 0 auto;
      background: linear-gradient(180deg, #151515 0%, #0d0d0d 100%);
      border: 1px solid var(--hf-border);
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
      padding: 32px 24px;
    }

    .brand { text-align: center; margin-bottom: 22px; }
    .brand h1 { margin: 0; font-size: 26px; color: var(--hf-blue); }
    .brand-link { color: inherit; text-decoration: none; }
    .brand-link:hover { text-decoration: underline; }
    .brand p { margin: 8px 0 0; font-size: 14px; color: var(--hf-muted); }

    /* progresso */
    .progresso { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 24px; }
    .progresso .ponto { width: 26px; height: 26px; border-radius: 50%; background: #0a0a0a; border: 1px solid #2f3b42; color: #8a9aa5; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; transition: 0.2s; }
    .progresso .linha { width: 24px; height: 2px; background: #2f3b42; }
    .progresso .ponto.ativo { background: var(--hf-blue); border-color: var(--hf-blue); color: #000; }
    .progresso .ponto.concluido { background: #0d2733; border-color: var(--hf-blue); color: var(--hf-blue); }
    .progresso .linha.concluida { background: var(--hf-blue); }

    .etapa-titulo { text-align: center; margin: 0 0 4px; font-size: 17px; color: var(--hf-text); }
    .etapa-subtitulo { text-align: center; margin: 0 0 20px; font-size: 13px; color: var(--hf-muted); }

    form { display: flex; flex-direction: column; }
    .etapa { display: flex; flex-direction: column; }
    .etapa[hidden] { display: none; }

    label { display: block; margin-top: 14px; margin-bottom: 6px; font-size: 13px; color: #d5dde2; }

    input, select {
      width: 100%;
      border: 1px solid #2f3b42;
      border-radius: 10px;
      background: #0a0a0a;
      color: var(--hf-text);
      padding: 12px;
      outline: none;
      font-size: 15px;
      min-height: 46px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--hf-blue);
      box-shadow: 0 0 0 3px rgba(0, 173, 238, 0.2);
    }

    .ajuda { display: block; color: var(--hf-muted); font-size: 12px; margin-top: 6px; line-height: 1.4; }

    .opcional-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 16px 0 0; font-size: 14px; color: #d5dde2; }
    .opcional-toggle input { width: 18px; min-height: 18px; accent-color: var(--hf-blue); }
    .campos-extra[hidden] { display: none; }

    .termosContainer { display: flex; align-items: flex-start; gap: 10px; margin-top: 18px; }
    .termosContainer input[type=checkbox] { width: 18px; min-height: 18px; margin: 2px 0 0; padding: 0; accent-color: var(--hf-blue); }
    .termosContainer label { margin: 0; font-size: 13px; font-weight: 400; line-height: 1.5; color: var(--hf-muted); }
    .termosContainer a { color: var(--hf-blue); font-weight: 700; text-decoration: none; }
    .termosContainer a:hover { text-decoration: underline; }
    .termosContainer strong { color: #d5dde2; }

    .resumo { background: #0a0a0a; border: 1px solid #2f3b42; border-radius: 10px; padding: 14px 16px; font-size: 13px; color: var(--hf-muted); line-height: 1.7; margin-top: 6px; }
    .resumo strong { color: var(--hf-text); }

    .botoes-etapa { display: flex; gap: 10px; margin-top: 22px; }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 13px;
      background: var(--hf-blue);
      color: #000;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      min-height: 48px;
      transition: background 0.2s, transform 0.1s;
      flex: 1;
    }

    button:hover { background: var(--hf-blue-dark); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-voltar { background: transparent; border: 1px solid #2f3b42; color: var(--hf-muted); }
    .btn-voltar:hover { background: #1a1a1a; }

    #statusCadastro {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #2f3b42;
      background: #0a0a0a;
      color: var(--hf-muted);
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
      display: none;
    }

    #statusCadastro.show { display: block; }
    #statusCadastro.success { border-color: #2f7a4a; background: #0d1f14; color: #7fe0a3; }
    #statusCadastro.error { border-color: #8a2f2f; background: #210d0d; color: #ff6b6b; }

    .divisor { display: flex; align-items: center; gap: 10px; margin: 22px 0 4px; color: #4d5860; font-size: 12px; }
    .divisor::before, .divisor::after { content: ""; flex: 1; height: 1px; background: #2f3b42; }

    .login-link { text-align: center; font-size: 14px; color: var(--hf-muted); margin-top: 4px; }
    .login-link a { color: var(--hf-blue); font-weight: 700; text-decoration: none; }
    .login-link a:hover { text-decoration: underline; }

    .back-home { display: block; text-align: center; margin-top: 18px; font-size: 13px; color: var(--hf-blue); text-decoration: none; }
    .back-home:hover { text-decoration: underline; }

    @media (min-width: 600px) { .cadastro-shell { padding: 36px; } }
  </style>
</head>
<body>
  <main class="cadastro-shell">
    <header class="brand">
      <h1><a href="index.html" class="brand-link">Help Floripa</a></h1>
      <p>Crie sua conta profissional para começar</p>
    </header>

    <div class="progresso" id="progresso">
      <div class="ponto ativo" data-ponto="1">1</div>
      <div class="linha"></div>
      <div class="ponto" data-ponto="2">2</div>
      <div class="linha"></div>
      <div class="ponto" data-ponto="3">3</div>
      <div class="linha"></div>
      <div class="ponto" data-ponto="4">4</div>
    </div>

    <form id="cadastroForm" novalidate>

      <!-- Etapa 1: acesso -->
      <div class="etapa" data-etapa="1">
        <p class="etapa-titulo">Crie seu acesso</p>
        <p class="etapa-subtitulo">Leva menos de um minuto</p>

        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required autocomplete="name">

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seunome@email.com" required autocomplete="email">

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" minlength="6" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">

        <div class="botoes-etapa">
          <button type="button" class="btn-avancar" data-proximo="2">Continuar</button>
        </div>
      </div>

      <!-- Etapa 2: contato e documento -->
      <div class="etapa" data-etapa="2" hidden>
        <p class="etapa-titulo">Contato e documento</p>
        <p class="etapa-subtitulo">Usamos para validar seu cadastro</p>

        <label for="telefone">Telefone / WhatsApp</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(DDD) 9xxxx-xxxx" required autocomplete="tel">

        <label for="cpf">CPF ou CNPJ</label>
        <input type="text" id="cpf" name="cpfCnpj" placeholder="Somente números" required inputmode="numeric">

        <label class="opcional-toggle">
          <input type="checkbox" id="mostrarInstagram">
          Quero adicionar meu Instagram (opcional)
        </label>
        <div class="campos-extra" id="extraInstagram" hidden>
          <label for="instagram">Instagram</label>
          <input type="text" id="instagram" name="instagram" placeholder="@seuusuario">
        </div>

        <div class="botoes-etapa">
          <button type="button" class="btn-voltar" data-voltar="1">Voltar</button>
          <button type="button" class="btn-avancar" data-proximo="3">Continuar</button>
        </div>
      </div>

      <!-- Etapa 3: onde e como você atende -->
      <div class="etapa" data-etapa="3" hidden>
        <p class="etapa-titulo">Onde você atende</p>
        <p class="etapa-subtitulo">Assim clientes da sua região te encontram</p>

        <label for="profissao">Profissão</label>
        <input type="text" id="profissao" name="profissao" placeholder="Ex: Eletricista, Encanador, Pintor..." required>

        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="cidade" placeholder="Ex: Florianópolis" required>

        <label for="bairro">Bairro</label>
        <input type="text" id="bairro" name="bairro" placeholder="Ex: Tapera" required>

        <label for="endereco">Rua e número</label>
        <input type="text" id="endereco" name="endereco" placeholder="Ex: Rua das Palmeiras, 123" required>

        <label for="residencia">Tipo de residência</label>
        <select id="residencia" name="residencia" required>
          <option value="">Selecione...</option>
          <option value="Casa">Casa</option>
          <option value="Apartamento">Apartamento</option>
        </select>

        <div id="campoBloco" hidden>
          <label for="bloco">Bloco e número</label>
          <input type="text" id="bloco" name="bloco" placeholder="Ex: Bloco B, Apto 202">
        </div>

        <label class="opcional-toggle">
          <input type="checkbox" id="mostrarCnh">
          Também atendo como motorista (informar CNH)
        </label>
        <div class="campos-extra" id="extraCnh" hidden>
          <label for="cnh">Número da CNH</label>
          <input type="text" id="cnh" name="cnh" placeholder="Número da CNH">

          <label for="categoria">Categoria da CNH</label>
          <select id="categoria" name="categoriaCnh">
            <option value="">Selecione...</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="AB">AB</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="E">E</option>
          </select>
        </div>

        <div class="botoes-etapa">
          <button type="button" class="btn-voltar" data-voltar="2">Voltar</button>
          <button type="button" class="btn-avancar" data-proximo="4">Continuar</button>
        </div>
      </div>

      <!-- Etapa 4: confirmação -->
      <div class="etapa" data-etapa="4" hidden>
        <p class="etapa-titulo">Confirme seu cadastro</p>
        <p class="etapa-subtitulo">Última etapa</p>

        <div class="resumo" id="resumo"></div>

        <div class="termosContainer">
          <input type="checkbox" id="concordo" required>
          <label for="concordo">
            Li e concordo com os <a href="termos.html" target="_blank" rel="noopener noreferrer">Termos de Compromisso</a>.
            O plano profissional custa <strong>R$ 30/mês</strong>, sem fidelidade, e o pagamento é feito por um link enviado no seu WhatsApp após o envio deste cadastro.
          </label>
        </div>

        <div class="botoes-etapa">
          <button type="button" class="btn-voltar" data-voltar="3">Voltar</button>
          <button type="submit" id="enviarBtn" disabled>Enviar Cadastro</button>
        </div>
        <div id="statusCadastro" role="status" aria-live="polite"></div>
      </div>

    </form>

    <div class="divisor">ou</div>
    <p class="login-link">Já tem uma conta? <a href="login.html">Entrar</a></p>
    <a class="back-home" href="index.html">Cancelar</a>
  </main>

<script type="module">
import { auth, db } from "./firebase.js";
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, serverTimestamp, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ---------- navegação por etapas ---------- */
const etapas = Array.from(document.querySelectorAll('.etapa'));
const pontos = Array.from(document.querySelectorAll('.progresso .ponto'));
const linhas = Array.from(document.querySelectorAll('.progresso .linha'));

function irPara(numero){
    etapas.forEach(et => et.hidden = et.dataset.etapa !== String(numero));
    pontos.forEach(p => {
        const n = Number(p.dataset.ponto);
        p.classList.toggle('ativo', n === numero);
        p.classList.toggle('concluido', n < numero);
    });
    linhas.forEach((l, i) => l.classList.toggle('concluida', i < numero - 1));
    if (numero === 4) montarResumo();
    document.querySelector('.cadastro-shell').scrollIntoView({behavior:'smooth', block:'start'});
}

function validarEtapa(numero){
    const etapa = document.querySelector(`.etapa[data-etapa="${numero}"]`);
    const campos = etapa.querySelectorAll('input:not([type=checkbox]), select');
    for (const campo of campos){
        const dentroDeExtraOculto = campo.closest('.campos-extra[hidden]');
        if (dentroDeExtraOculto) continue;
        if (!campo.checkValidity()){
            campo.reportValidity();
            return false;
        }
    }
    return true;
}

document.querySelectorAll('.btn-avancar').forEach(btn => {
    btn.addEventListener('click', () => {
        const atual = btn.closest('.etapa').dataset.etapa;
        if (!validarEtapa(atual)) return;
        irPara(Number(btn.dataset.proximo));
    });
});

document.querySelectorAll('.btn-voltar').forEach(btn => {
    btn.addEventListener('click', () => irPara(Number(btn.dataset.voltar)));
});

/* ---------- campos condicionais ---------- */
const mostrarInstagram = document.getElementById('mostrarInstagram');
const extraInstagram = document.getElementById('extraInstagram');
mostrarInstagram.addEventListener('change', () => {
    extraInstagram.hidden = !mostrarInstagram.checked;
});

const residencia = document.getElementById('residencia');
const campoBloco = document.getElementById('campoBloco');
residencia.addEventListener('change', () => {
    campoBloco.hidden = residencia.value !== 'Apartamento';
});

const mostrarCnh = document.getElementById('mostrarCnh');
const extraCnh = document.getElementById('extraCnh');
mostrarCnh.addEventListener('change', () => {
    extraCnh.hidden = !mostrarCnh.checked;
});

/* ---------- resumo final ---------- */
function montarResumo(){
    const nome = document.getElementById('nome').value;
    const profissao = document.getElementById('profissao').value;
    const cidade = document.getElementById('cidade').value;
    const bairro = document.getElementById('bairro').value;
    document.getElementById('resumo').innerHTML =
        `<strong>${nome}</strong><br>${profissao}<br>${bairro}, ${cidade}`;
}

/* ---------- envio ---------- */
const concordo = document.getElementById("concordo");
const enviarBtn = document.getElementById("enviarBtn");
const statusCadastro = document.getElementById("statusCadastro");

function atualizarStatus(message, type = "") {
    statusCadastro.textContent = message;
    statusCadastro.className = "show";
    if (type) {
        statusCadastro.classList.add(type);
    }
}

concordo.addEventListener("change", function() {
    enviarBtn.disabled = !this.checked;
});

document.getElementById("cadastroForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    if (!concordo.checked) {
        atualizarStatus("Você precisa aceitar os termos para continuar.", "error");
        return;
    }

    const data = new FormData(e.target);
    const obj = Object.fromEntries(data);
    const email = String(obj.email || "").trim().toLowerCase();
    const senha = String(obj.senha || "");

    if (senha.length < 6) {
        atualizarStatus("A senha precisa ter no mínimo 6 caracteres.", "error");
        return;
    }

    enviarBtn.disabled = true;
    enviarBtn.textContent = "Cadastrando...";
    atualizarStatus("Criando conta e salvando seus dados profissionais...");

    try {
        const cred = await createUserWithEmailAndPassword(auth, email, senha);
        const { uid } = cred.user;

        await setDoc(doc(db, "usuarios", uid), {
            uid,
            tipoUsuario: "profissional",
            nome: obj.nome,
            email,
            telefone: obj.telefone,
            instagram: obj.instagram || "",
            cpfCnpj: obj.cpfCnpj,
            profissao: obj.profissao,
            cidade: obj.cidade,
            bairro: obj.bairro,
            residencia: obj.residencia,
            bloco: obj.bloco || "",
            endereco: obj.endereco,
            cnh: obj.cnh || "",
            categoriaCnh: obj.categoriaCnh || "",
            aceiteTermos: true,
            plano: "Profissional",
            valorPlanoMensal: 30,
            origemCadastro: "cadastro.profissional.html",
            criadoEm: serverTimestamp()
        });

        atualizarStatus("Cadastro profissional salvo com sucesso! Redirecionando para o login...", "success");
        e.target.reset();
        setTimeout(() => {
            window.location.href = "login.html";
        }, 1400);
    } catch (error) {
        let mensagemErro = "Não foi possível concluir o cadastro agora. Tente novamente.";

        if (error?.code === "auth/email-already-in-use") {
            mensagemErro = "Este e-mail já está em uso. Tente fazer login ou use outro e-mail.";
        } else if (error?.code === "auth/invalid-email") {
            mensagemErro = "Digite um e-mail válido para continuar.";
        } else if (error?.code === "auth/weak-password") {
            mensagemErro = "A senha informada é fraca. Use pelo menos 6 caracteres.";
        }

        atualizarStatus(mensagemErro, "error");
        console.error("Erro ao cadastrar profissional:", error);
        enviarBtn.disabled = false;
    } finally {
        if (enviarBtn.textContent === "Cadastrando...") {
            enviarBtn.textContent = "Enviar Cadastro";
            enviarBtn.disabled = !concordo.checked;
        }
    }
});
</script>

</body>
</html>
