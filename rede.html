<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <!-- A rede social do Help Floripa numa página só (como os apps grandes): Diário, Explorar, Comunidade, Mensagens e
       Perfil ficam abertos lado a lado e trocar de aba não recarrega nada. Cada aba é a própria página de sempre
       (feed.html, mural.html, mensagens.html, usuarios.html) carregada uma vez dentro desta. Código: rede-app.js. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self'; connect-src 'self' https://southamerica-east1-helpfloripa-61e0d.cloudfunctions.net https://www.gstatic.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0b1014" />
  <meta name="robots" content="noindex" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png" />
  <link rel="icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <title>Help Floripa</title>
  <!-- As páginas das abas conferem isto para saber que estão dentro da rede (e não numa gaveta). -->
  <script>window.__hfShell = { pronto: false };</script>
  <style>
    /* fonte da marca (a cópia do topo durante o deslize fica nesta página) */
    @font-face { font-family: "HF Marca"; src: url("fonte-marca.woff2") format("woff2"); font-weight: 900; font-style: italic; font-display: swap; }
    /* cópia do topo (rede-app.js): links herdam a cor do topo, não o azul padrão de link */
    body > header a { color: inherit; text-decoration: none; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #070b0e; overscroll-behavior: none; }
    @media (prefers-color-scheme: light) { html, body { background: #f4f6f8; } }
    /* atrás do cubo (troca de aba deslizando) */
    body.girando { background: #000; }
    .hf-quadro { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; visibility: hidden; background: transparent; }
    .hf-quadro.ativo, .hf-quadro.movendo { visibility: visible; }
    .hf-quadro.movendo { will-change: transform; z-index: 2; }
    .hf-quadro.entra { z-index: 3; }
    .hf-quadro.movendo { backface-visibility: hidden; }
    .hf-quadro.ativo { z-index: 1; }
    /* Quadro por cima da aba atual (ligação que chegou, flash aberto do Mensagens): rede-app.js porCima */
    .hf-quadro.por-cima { visibility: visible; z-index: 20; }
    .hf-flash-espera { position: fixed; inset: 0; z-index: 30; background: #000; display: grid; place-items: center; }
    .hf-flash-espera span { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .25); border-top-color: #fff; animation: hfGira .8s linear infinite; }
    @keyframes hfGira { to { transform: rotate(360deg); } }
    .hf-aviso-rede { position: fixed; z-index: 40; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: max-content; max-width: min(440px, calc(100vw - 32px));
      padding: 11px 16px; border-radius: 14px; background: rgba(17, 17, 17, .96); color: #fff; font: 600 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; text-wrap: balance; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); transition: opacity .3s; }
    .hf-aviso-rede.sai { opacity: 0; }
    .hf-quadro.anima { transition: transform .24s cubic-bezier(.22, .9, .3, 1); }
    @media (prefers-reduced-motion: reduce) { .hf-quadro.anima { transition: none; } }
    .hf-carregando { position: fixed; inset: 0; display: grid; place-items: center; color: #8a98a3; font: 600 14px/1.4 system-ui, sans-serif; z-index: 0; }
  </style>
</head>
<body>
  <div class="hf-carregando" id="carregandoRede">Carregando...</div>
  <script type="module" src="rede-app.js?v=11"></script>
</body>
</html>
