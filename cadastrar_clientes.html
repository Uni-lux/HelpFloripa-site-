<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastre-se como cliente | Help Floripa</title>
  <meta name="description" content="Crie sua conta de cliente na Help Floripa.">
  <meta name="author" content="Help Floripa">

  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1279593590387539');
    fbq('track', 'PageView');
    fbq('track', 'cadastrar_cliente');
  </script>
  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1279593590387539&ev=PageView&noscript=1"></noscript>

  <style>
    :root {
      --hf-blue: #00adee;
      --hf-blue-dark: #0087c2;
      --hf-bg: #000;
      --hf-surface: #111;
      --hf-text: #f1f1f1;
      --hf-muted: #b9c2c8;
      --hf-border: #00adee66;
    }

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #0b1b24 0%, var(--hf-bg) 38%);
      color: var(--hf-text);
      padding: 32px 16px 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cadastro-shell {
      width: min(400px, 100%);
      margin: 0 auto;
      background: linear-gradient(180deg, #151515 0%, #0d0d0d 100%);
      border: 1px solid var(--hf-border);
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
      padding: 32px 24px;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand h1 {
      margin: 0;
      font-size: 26px;
      color: var(--hf-blue);
    }

    .brand p {
      margin: 8px 0 0;
      font-size: 14px;
      color: var(--hf-muted);
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-size: 13px;
      color: #d5dde2;
    }

    input {
      width: 100%;
      border: 1px solid #2f3b42;
      border-radius: 10px;
      background: #0a0a0a;
      color: var(--hf-text);
      padding: 12px;
      outline: none;
      font-size: 15px;
      min-height: 46px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--hf-blue);
      box-shadow: 0 0 0 3px rgba(0, 173, 238, 0.2);
    }

    .ajuda {
      display: block;
      color: var(--hf-muted);
      font-size: 12px;
      margin-top: 6px;
      line-height: 1.4;
    }

    .termosContainer {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 18px;
    }

    .termosContainer input[type=checkbox] {
      width: 18px;
      min-height: 18px;
      margin: 2px 0 0;
      padding: 0;
      accent-color: var(--hf-blue);
    }

    .termosContainer label {
      margin: 0;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.45;
      color: var(--hf-muted);
    }

    .termosContainer a {
      color: var(--hf-blue);
      font-weight: 700;
      text-decoration: none;
    }

    .termosContainer a:hover { text-decoration: underline; }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 13px;
      background: var(--hf-blue);
      color: #000;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 20px;
      min-height: 48px;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover { background: var(--hf-blue-dark); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    #statusCadastro {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #2f3b42;
      background: #0a0a0a;
      color: var(--hf-muted);
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
      display: none;
    }

    #statusCadastro.show { display: block; }
    #statusCadastro.success { border-color: #2f7a4a; background: #0d1f14; color: #7fe0a3; }
    #statusCadastro.error { border-color: #8a2f2f; background: #210d0d; color: #ff6b6b; }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: var(--hf-blue);
      text-decoration: none;
    }

    .back-home:hover { text-decoration: underline; }

    .divisor {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0 4px;
      color: #4d5860;
      font-size: 12px;
    }

    .divisor::before, .divisor::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #2f3b42;
    }

    .login-link {
      text-align: center;
      font-size: 14px;
      color: var(--hf-muted);
      margin-top: 4px;
    }

    .login-link a {
      color: var(--hf-blue);
      font-weight: 700;
      text-decoration: none;
    }

    .modalSaida {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.75);
      z-index: 9999;
    }

    .modalSaida.show { display: flex; }

    .modalSaidaBox {
      width: min(420px, 100%);
      background: linear-gradient(180deg, #151515 0%, #0d0d0d 100%);
      border: 1px solid var(--hf-border);
      color: var(--hf-text);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
    }

    .modalSaidaBox h2 {
      color: var(--hf-blue);
      font-size: 20px;
      margin: 0 0 8px;
    }

    .modalSaidaBox p {
      color: var(--hf-muted);
      line-height: 1.5;
      font-size: 14px;
      margin: 0;
    }

    .modalAcoes {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }

    .btnContinuarCadastro { background: var(--hf-blue); color: #000; }
    .btnContinuarCadastro:hover { background: var(--hf-blue-dark); }

    .btnSairCadastro {
      background: transparent;
      border: 1px solid #2f3b42;
      color: var(--hf-muted);
    }

    .btnSairCadastro:hover { background: #1a1a1a; }

    @media (min-width: 600px) {
      .cadastro-shell { padding: 36px; }
    }
  </style>
</head>

<body>
  <main class="cadastro-shell">
    <header class="brand">
      <h1>Help Floripa</h1>
      <p>Crie sua conta para começar</p>
    </header>

    <form id="cadastrarForm">
      <label for="nome">Nome completo:</label>
      <input type="text" id="nome" name="nome" autocomplete="name" required>

      <label for="nickname">Nome de usuário:</label>
      <input type="text" id="nickname" name="nickname" maxlength="20"
             autocomplete="off" placeholder="Ex: joaosilva" required>
      <span class="ajuda" id="nicknameStatus">Mínimo de 3 caracteres, sem espaços.</span>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email"
             placeholder="seunome@email.com" autocomplete="email" required>

      <label for="telefone">Telefone:</label>
      <input type="tel" id="telefone" name="telefone"
             placeholder="(00) 00000-0000" autocomplete="tel" required>

      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha"
             minlength="6" placeholder="Mínimo 6 caracteres"
             autocomplete="new-password" required>

      <label for="confirmarSenha">Confirmar senha:</label>
      <input type="password" id="confirmarSenha" name="confirmarSenha"
             minlength="6" autocomplete="new-password" required>

      <label for="dataNascimento">Data de nascimento:</label>
      <input type="date" id="dataNascimento" name="dataNascimento" required>

      <div class="termosContainer">
        <input type="checkbox" id="aceiteTermos" required>
        <label for="aceiteTermos">
          Li e concordo com os
          <a href="termos.html" target="_blank">Termos de Uso</a>
          e a Política de Privacidade.
        </label>
      </div>

      <button type="submit" id="btnCadastrar">Cadastrar</button>

      <div id="statusCadastro" role="status" aria-live="polite"></div>
    </form>

    <div class="divisor">ou</div>
    <p class="login-link">Já tem uma conta? <a href="login.html">Entrar</a></p>

    <a class="back-home" href="index.html" id="btnCancelar">Cancelar</a>
  </main>

  <div class="modalSaida" id="modalSaida" role="dialog"
       aria-modal="true" aria-labelledby="tituloModalSaida">
    <div class="modalSaidaBox">
      <h2 id="tituloModalSaida">Deseja sair do cadastro?</h2>
      <p>
        Você ainda não concluiu seu cadastro. Se sair agora, os dados preenchidos
        nesta página poderão ser perdidos.
      </p>
      <div class="modalAcoes">
        <button type="button" class="btnContinuarCadastro" id="btnContinuarCadastro">
          Continuar cadastrando
        </button>
        <button type="button" class="btnSairCadastro" id="btnSairCadastro">
          Sair
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { createUserWithEmailAndPassword, updateProfile, sendEmailVerification }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { doc, serverTimestamp, getDoc, writeBatch }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const form = document.getElementById("cadastrarForm");
    const statusCadastro = document.getElementById("statusCadastro");

    function atualizarStatus(message, type = "") {
      statusCadastro.textContent = message;
      statusCadastro.className = "show";
      if (type) statusCadastro.classList.add(type);
    }

    const nicknameInput = document.getElementById("nickname");
    const nicknameStatus = document.getElementById("nicknameStatus");
    let nicknameDisponivel = false;
    let nicknameTimeout;

    function normalizarNickname(valor) {
      return String(valor || "").trim().toLowerCase().replace(/\s+/g, "");
    }

    nicknameInput.addEventListener("input", () => {
      nicknameInput.value = nicknameInput.value.replace(/\s+/g, "");
      const nick = normalizarNickname(nicknameInput.value);
      nicknameDisponivel = false;
      clearTimeout(nicknameTimeout);

      if (nick.length < 3) {
        nicknameStatus.textContent = "Mínimo de 3 caracteres, sem espaços.";
        nicknameStatus.style.color = "";
        return;
      }

      if (!/^[a-z0-9._]+$/.test(nick)) {
        nicknameStatus.textContent = "Use apenas letras, números, ponto ou underline.";
        nicknameStatus.style.color = "#ff6b6b";
        return;
      }

      nicknameStatus.textContent = "Verificando disponibilidade...";
      nicknameStatus.style.color = "";

      nicknameTimeout = setTimeout(async () => {
        try {
          const snap = await getDoc(doc(db, "nicknames", nick));
          if (snap.exists()) {
            nicknameStatus.textContent = "Esse nome de usuário já está em uso.";
            nicknameStatus.style.color = "#ff6b6b";
          } else {
            nicknameDisponivel = true;
            nicknameStatus.textContent = "Nome de usuário disponível.";
            nicknameStatus.style.color = "#7fe0a3";
          }
        } catch (error) {
          nicknameStatus.textContent = "Não foi possível verificar agora. Tente de novo.";
          nicknameStatus.style.color = "#ff6b6b";
        }
      }, 500);
    });

    function calcularIdade(dataStr) {
      const nascimento = new Date(dataStr + "T00:00:00");
      if (isNaN(nascimento.getTime())) return null;

      const hoje = new Date();
      let idade = hoje.getFullYear() - nascimento.getFullYear();
      const diferencaMes = hoje.getMonth() - nascimento.getMonth();

      if (diferencaMes < 0 || (diferencaMes === 0 && hoje.getDate() < nascimento.getDate())) {
        idade--;
      }

      return idade;
    }

    const dataNascimentoInput = document.getElementById("dataNascimento");
    dataNascimentoInput.max = new Date().toISOString().slice(0, 10);

    // --- Modal de saída (evita perder o cadastro sem querer) ---
    const modalSaida = document.getElementById("modalSaida");
    const btnContinuarCadastro = document.getElementById("btnContinuarCadastro");
    const btnSairCadastro = document.getElementById("btnSairCadastro");
    let permitirSaida = false;

    function cadastroFoiIniciado() {
      const campos = ["nome", "nickname", "email", "telefone", "senha", "confirmarSenha", "dataNascimento"];
      return campos.some(id => {
        const el = document.getElementById(id);
        return el && String(el.value || "").trim() !== "";
      });
    }

    function mostrarModalSaida() {
      if (!cadastroFoiIniciado() || permitirSaida) return false;
      modalSaida.classList.add("show");
      return true;
    }

    btnContinuarCadastro.addEventListener("click", () => {
      modalSaida.classList.remove("show");
    });

    btnSairCadastro.addEventListener("click", () => {
      permitirSaida = true;
      modalSaida.classList.remove("show");
      window.location.href = "index.html";
    });

    document.getElementById("btnCancelar").addEventListener("click", (e) => {
      if (mostrarModalSaida()) {
        e.preventDefault();
      }
    });

    window.addEventListener("beforeunload", (event) => {
      if (!cadastroFoiIniciado() || permitirSaida) return;
      event.preventDefault();
      event.returnValue = "";
    });

    history.pushState({ cadastro: true }, "", window.location.href);

    window.addEventListener("popstate", () => {
      if (permitirSaida || !cadastroFoiIniciado()) {
        history.back();
        return;
      }
      history.pushState({ cadastro: true }, "", window.location.href);
      mostrarModalSaida();
    });

    // --- Envio do cadastro ---
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const nome = document.getElementById("nome");
      const nickname = document.getElementById("nickname");
      const email = document.getElementById("email");
      const telefone = document.getElementById("telefone");
      const senha = document.getElementById("senha");
      const confirmarSenha = document.getElementById("confirmarSenha");
      const dataNascimento = document.getElementById("dataNascimento");
      const termos = document.getElementById("aceiteTermos");
      const btn = document.getElementById("btnCadastrar");

      if (!nome.value.trim() || !nickname.value.trim() || !email.value.trim() ||
          !telefone.value.trim() || !senha.value || !confirmarSenha.value ||
          !dataNascimento.value) {
        atualizarStatus("Preencha todos os campos obrigatórios.", "error");
        return;
      }

      const nickFinal = normalizarNickname(nickname.value);

      if (nickFinal.length < 3 || !nicknameDisponivel) {
        atualizarStatus("Escolha um nome de usuário válido e disponível.", "error");
        nickname.focus();
        return;
      }

      const idade = calcularIdade(dataNascimento.value);
      if (idade === null || idade < 0) {
        atualizarStatus("Digite uma data de nascimento válida.", "error");
        dataNascimento.focus();
        return;
      }

      if (senha.value.length < 6) {
        atualizarStatus("A senha precisa ter no mínimo 6 caracteres.", "error");
        senha.focus();
        return;
      }

      if (senha.value !== confirmarSenha.value) {
        atualizarStatus("As senhas não coincidem.", "error");
        confirmarSenha.focus();
        return;
      }

      if (!termos.checked) {
        atualizarStatus("Você precisa aceitar os Termos de Uso para continuar.", "error");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Verificando nome de usuário...";
      atualizarStatus("Verificando nome de usuário...");

      const nickRef = doc(db, "nicknames", nickFinal);
      const nickSnap = await getDoc(nickRef);

      if (nickSnap.exists()) {
        atualizarStatus("Esse nome de usuário já foi escolhido por outra pessoa.", "error");
        btn.disabled = false;
        btn.textContent = "Cadastrar";
        return;
      }

      btn.textContent = "Criando conta...";
      atualizarStatus("Criando sua conta...");

      const emailFinal = email.value.trim().toLowerCase();

      try {
        const cred = await createUserWithEmailAndPassword(auth, emailFinal, senha.value);
        const user = cred.user;

        await updateProfile(user, { displayName: nome.value.trim() });
        await sendEmailVerification(user);

        const dadosUsuario = {
          uid: user.uid,
          nome: nome.value.trim(),
          nickname: nickFinal,
          dataNascimento: dataNascimento.value,
          telefone: telefone.value.trim(),
          email: emailFinal,
          fotoPerfil: "",
          fotoCapa: "",
          tipoUsuario: "cliente",
          emailVerificado: false,
          aceiteTermos: true,
          criadoEm: serverTimestamp()
        };

        const batch = writeBatch(db);
        batch.set(doc(db, "usuarios", user.uid), dadosUsuario);
        batch.set(nickRef, { uid: user.uid, criadoEm: serverTimestamp() });
        await batch.commit();

        permitirSaida = true;

        atualizarStatus(
          "Conta criada! Enviamos um link de verificação para seu e-mail.",
          "success"
        );

        setTimeout(() => {
          window.location.href = "verificar-email.html";
        }, 2200);

      } catch (error) {
        console.error("Erro ao cadastrar cliente:", error);

        let mensagem = "Não foi possível concluir o cadastro agora. Tente novamente.";

        if (error?.code === "auth/email-already-in-use") {
          mensagem = "Este e-mail já está em uso. Tente fazer login ou use outro e-mail.";
        } else if (error?.code === "auth/invalid-email") {
          mensagem = "Digite um e-mail válido para continuar.";
        } else if (error?.code === "auth/weak-password") {
          mensagem = "A senha informada é fraca. Use pelo menos 6 caracteres.";
        }

        atualizarStatus(mensagem, "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Cadastrar";
      }
    });
  </script>
</body>
</html>
