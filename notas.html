<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex" /><!-- área de quem tem conta: fora da busca do Google -->
  <!-- Segurança: só carrega recursos de origens conhecidas e não deixa outro site embutir esta página -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://www.google.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://lh3.googleusercontent.com https://images.unsplash.com https://upload.wikimedia.org https://randomuser.me https://www.gstatic.com https://www.google.com https://tile.openstreetmap.org https://api.mapbox.com; media-src 'self' data: blob: https://firebasestorage.googleapis.com; connect-src 'self' https://southamerica-east1-helpfloripa-61e0d.cloudfunctions.net https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://viacep.com.br https://nominatim.openstreetmap.org https://router.project-osrm.org https://api.mapbox.com https://www.google.com https://www.gstatic.com; frame-src 'self' https://helpfloripa-61e0d.firebaseapp.com https://accounts.google.com https://www.google.com https://www.recaptcha.net; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://formsubmit.co; upgrade-insecure-requests" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <script>
    // Outro site não pode embutir esta página. Dentro do próprio Help Floripa (conversa "Notas" das Mensagens) pode.
    if (window.top !== window.self) {
      var mesmoSite = false, naRede = false;
      try { mesmoSite = window.top.location.origin === window.location.origin; naRede = mesmoSite && window.parent === window.top && !!window.top.__hfShell; } catch (e) {}
      if (naRede) {}
      else if (mesmoSite) document.documentElement.classList.add("embutido");
      else { document.documentElement.style.display = "none"; try { window.top.location.replace(window.self.location.href); } catch (e) {} }
    }
  </script>
  <style>
    /* Dentro das Mensagens: sem o topo do site, sem a barra de baixo e sem o título (a conversa já tem) */
    html.embutido .topo, html.embutido .barra-rede, html.embutido #barraRede, html.embutido .nt-tit h1 { display: none !important; }
    html.embutido body.com-barra { padding-bottom: 0; }
    html.embutido body.com-barra::after { display: none; }
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <!-- Só mostra a página depois de confirmar o login (auth-guard.js; sem conta vai para o login) -->
  <style>html.hf-auth-checking { visibility: hidden; }</style>
  <script>document.documentElement.classList.add("hf-auth-checking");</script>
  <meta name="description" content="Suas notas no Help Floripa: anotações, ideias, listas e estratégias. Só você vê." />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Help Floripa" />
  <title>Notas | Help Floripa</title>
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png" />
  <link rel="icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <script>
    // Tema claro/escuro: o mesmo do perfil, das mensagens e do menu.
    (function () {
      var c = {};
      try { c = JSON.parse(localStorage.getItem("hf-chat-config") || "{}"); } catch (e) {}
      var tema = c.tema || "sistema";
      var escuro = tema === "escuro" || (tema === "sistema" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = escuro ? "dark" : "light";
    })();
  </script>
  <link rel="stylesheet" href="rede.css?v=110" />
  <link rel="stylesheet" href="notas.css?v=2" />
  <script type="module" src="firebase.js"></script>
  <script type="module" src="auth-guard.js"></script>
  <script type="module" src="notas.js?v=19"></script>
</head>
<body class="com-barra">
  <header class="topo">
    <a href="index.html" class="icone-btn" aria-label="Início do Help Floripa" title="Início"><svg class="i"><use href="#i-casa"/></svg></a>
    <span class="topo-espaco" aria-hidden="true"></span>
    <a href="index.html" class="marca" aria-label="Help Floripa - Início"><strong>HELP <span>FLORIPA</span></strong><small>TUDO EM UM SÓ LUGAR</small></a>
    <a href="notificacoes.html" class="icone-btn" aria-label="Notificações" title="Notificações"><svg class="i"><use href="#i-sino"/></svg><b class="ponto-badge" id="badgeAvisos" hidden></b></a>
    <a href="configuracoes.html" class="icone-btn" aria-label="Configurações" title="Configurações"><svg class="i"><use href="#i-config"/></svg></a>
  </header>
  <main class="pagina nt-pagina" id="ntPagina">
    <section class="nt-topo">
      <div class="nt-tit">
        <h1>Notas</h1>
        <p id="ntResumo">Suas anotações, ideias e estratégias. Só você vê.</p>
      </div>
    </section>
    <div class="nt-busca">
      <svg class="nt-i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input type="search" id="ntBusca" placeholder="Pesquisar nas notas" aria-label="Pesquisar nas notas" autocomplete="off" />
      <button type="button" class="nt-ordem" id="ntOrdem" aria-label="Ordenar"><svg class="nt-i" viewBox="0 0 24 24"><path d="M7 5v14M4 16l3 3 3-3M17 19V5M14 8l3-3 3 3"/></svg><span id="ntOrdemTx">Recentes</span></button>
    </div>
    <div class="nt-filtros" id="ntFiltros" role="tablist" aria-label="Pastas e filtros" data-sem-deslizar></div>
    <div class="nt-painel" id="ntPainel" hidden></div>
    <div class="nt-aviso" id="ntAviso" hidden></div>
    <div class="nt-grade" id="ntGrade"><p class="nt-vazio">Carregando...</p></div>
  </main>
  <!-- Caixa de digitação no jeito de uma conversa (12/11/2026, pedido dele): escreve e envia = nota nova na hora. -->
  <form class="nt-comp" id="ntComp" autocomplete="off">
    <button type="button" class="nt-comp-mais" id="ntNova" aria-label="Mais opções: lista de tarefas e modelos" title="Lista de tarefas e modelos"><svg class="nt-i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <div class="nt-comp-campo">
      <textarea id="ntRapida" rows="1" maxlength="20000" placeholder="Escreva uma nota…" aria-label="Escreva uma nota"></textarea>
      <button type="button" class="nt-comp-lista" id="ntRapidaLista" aria-label="Começar uma lista de tarefas" title="Lista de tarefas"><svg class="nt-i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg></button>
    </div>
    <button type="submit" class="nt-comp-enviar" id="ntRapidaEnviar" aria-label="Salvar a nota" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12 3 4.8a.6.6 0 0 1 .84-.66l16.3 7.3a.6.6 0 0 1 0 1.1l-16.3 7.3A.6.6 0 0 1 3 19.2L4.5 12zm0 0h7"/></svg></button>
  </form>
</body>
</html>
