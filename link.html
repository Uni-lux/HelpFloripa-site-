<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://www.google.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://www.google.com https://www.gstatic.com; frame-src 'self' https://helpfloripa-61e0d.firebaseapp.com https://www.google.com https://www.recaptcha.net; object-src 'none'; base-uri 'self'; upgrade-insecure-requests" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b1014" />
  <title>Abrindo perfil | Help Floripa</title>
  <link rel="icon" href="/favicon.ico" />
  <!-- Link curto do perfil (helpfloripa.com.br/@nome ou /@nome/tipo, vindo do 404.html): descobre de quem é o @
       (nicknames/{nome}, que qualquer um lê) e leva ao perfil da pessoa ou ao perfil de negócio. -->
  <style>
    :root { --bg: #070b0e; --panel: #0f161b; --line: #213038; --text: #eaf0f3; --muted: #8c9ca7; --accent: #00adee; color-scheme: dark; }
    @media (prefers-color-scheme: light) { :root { --bg: #f1f4f6; --panel: #fff; --line: #e1e7eb; --text: #0e1a21; --muted: #607380; color-scheme: light; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; }
    .caixa { width: min(380px, 100%); padding: 28px 22px; border-radius: 22px; background: var(--panel); border: 1px solid var(--line); }
    .marca { font-size: 20px; font-weight: 850; letter-spacing: .2px; } .marca span { color: var(--accent); }
    .roda { width: 34px; height: 34px; margin: 22px auto 14px; border-radius: 50%; border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent); animation: gira .8s linear infinite; }
    @keyframes gira { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .roda { animation: none; } }
    p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
    h1 { margin: 18px 0 6px; font-size: 20px; }
    a.bt { display: inline-block; margin-top: 18px; padding: 12px 20px; border-radius: 12px; background: var(--accent); color: #001a24; font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <main class="caixa" id="caixa">
    <div class="marca">HELP <span>FLORIPA</span></div>
    <div class="roda" aria-hidden="true"></div>
    <p id="msg">Abrindo o perfil…</p>
  </main>
  <script type="module">
    import { db } from "./firebase.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    const PAGINAS = { servicos: ["servicos.html", "servicos"], freelances: ["servicos.html", "servicos"], delivery: ["delivery.html", "delivery"],
      loja: ["shopping.html", "lojinha"], lojinha: ["shopping.html", "lojinha"], shopping: ["shopping.html", "lojinha"], imoveis: ["imoveis.html", "imoveis"], saude: ["saude.html", "saude"] };
    const p = new URLSearchParams(location.search);
    const nick = String(p.get("n") || "").toLowerCase(), tipo = String(p.get("t") || "").toLowerCase();
    function naoAchou() {
      const c = document.getElementById("caixa");
      c.replaceChildren();
      const m = document.createElement("div"); m.className = "marca"; m.innerHTML = "HELP <span>FLORIPA</span>";
      const h = document.createElement("h1"); h.textContent = "Perfil não encontrado";
      const t = document.createElement("p"); t.textContent = `Não achamos ninguém com o @${nick || "…"}. Confira o endereço ou procure no Help Floripa.`;
      const a = document.createElement("a"); a.className = "bt"; a.href = "index.html"; a.textContent = "Ir para o início";
      c.append(m, h, t, a);
      document.title = "Perfil não encontrado | Help Floripa";
    }
    try {
      if (!/^[a-z0-9._]{3,30}$/.test(nick)) throw new Error("@ inválido");
      const s = await getDoc(doc(db, "nicknames", nick));
      const uid = s.exists() ? s.data().uid : "";
      if (!uid) throw new Error("sem dono");
      const destino = PAGINAS[tipo] ? `${PAGINAS[tipo][0]}?negocio=${encodeURIComponent(`${uid}_${PAGINAS[tipo][1]}`)}` : `usuarios.html?perfil=${encodeURIComponent(uid)}`;
      location.replace(destino);
    } catch (e) { console.warn("[Link curto]", e?.message || e); naoAchou(); }
  </script>
</body>
</html>
